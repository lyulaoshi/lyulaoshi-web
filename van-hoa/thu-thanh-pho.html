<style>
/* Sảnh ga thành phố (khung chung): thu-thanh-pho.html?c=<mã ga>; nội dung ở VH_TP[mã].sanh (bac-kinh.js…). BẢN CHẠY THỬ, chờ cô duyệt */
:root{--do:#C8423B;--kai:"STKaiti","KaiTi","Kaiti SC",serif;--giay:#FBF5E8;--ban-do:#F6EEDC;--duong:#E4D6BA;--xanh:#2F7FA0;--bt:#FFFDF8;--bt-chu:#5A4636;--bt-phu:#8A7A6A}
:root[data-theme="dark"]{--giay:#2A2620;--ban-do:#E9DFCB;--duong:#D3C3A2;--bt:#E9DFCB;--bt-chu:#4A3A2C;--bt-phu:#6E5E4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--giay:#2A2620;--ban-do:#E9DFCB;--duong:#D3C3A2;--bt:#E9DFCB;--bt-chu:#4A3A2C;--bt-phu:#6E5E4E}}
[hidden]{display:none!important}
body{background:var(--ground)}
.zh{font-family:var(--kai);font-weight:400}
.duong-di{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:700;color:var(--muted);margin:18px 0 12px}
.duong-di .zh{color:var(--do);font-size:17px}.duong-di .lli{width:14px;height:14px}
/* biển ga + bưu thiếp 3D */
.sanh{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.bien{display:inline-grid;justify-items:center;background:#1F3B5C;color:#fff;border-radius:10px;padding:8px 22px 7px;box-shadow:0 6px 0 #142840,var(--shadow);border:2px solid #E8EEF4}
.bien b{font-family:var(--kai);font-weight:400;font-size:34px;letter-spacing:.3em;line-height:1.1;padding-left:.3em}
.bien small{font-size:11.5px;font-weight:700;letter-spacing:.18em;opacity:.85}
.chao{margin:16px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chao .zh{font-size:36px;color:var(--do);line-height:1.15}
.chao-py{font-weight:700;color:var(--muted);margin:0 0 12px}
.sanh p{margin:0 0 12px;font-size:15.5px;line-height:1.65}
.spk{border:0;background:var(--ground2);color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}.spk .lli{width:18px;height:18px}
.bia{position:relative;background:var(--bt);padding:10px 10px 34px;border-radius:6px;box-shadow:0 18px 40px rgba(30,20,10,.22),0 2px 6px rgba(0,0,0,.12);transform:rotate(-1deg);transition:transform .15s}
.bia.t3{transform:perspective(900px) rotateY(calc(var(--mx)*7deg)) rotateX(calc(var(--my)*-6deg))}
.bia .khung{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:3px;background:#3b4a6b}
.bia img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:60% 60%;filter:sepia(.18) saturate(1.06) contrast(1.04) brightness(1.03);transition:transform .2s ease-out}
.bia.t3 img{transform:translate(calc(var(--mx)*-10px),calc(var(--my)*-7px))}
.bia .khung::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(70,40,10,.28) 100%),linear-gradient(180deg,rgba(255,214,150,.10),rgba(255,170,90,.12));mix-blend-mode:multiply}
.bia .khung::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at calc(50% + var(--mx,0)*45%) calc(35% + var(--my,0)*45%),rgba(255,255,255,.25),transparent 55%)}
.bia .chu-tay{position:absolute;left:16px;bottom:8px;font-family:var(--kai);font-size:17px;color:var(--bt-chu)}
.bia .nguon{position:absolute;right:12px;bottom:10px;font-size:10px;color:var(--bt-phu);max-width:56%;text-align:right;line-height:1.25}.bia .nguon a{color:inherit}
@media (max-width:520px){.bia{padding-bottom:50px}.bia .chu-tay{bottom:26px}.bia .nguon{left:16px;right:auto;bottom:8px;max-width:none;text-align:left;font-size:9.5px}}
@media (prefers-reduced-motion:reduce){.bia.t3,.bia.t3 img{transform:none!important}}
@media (max-width:820px){.sanh{grid-template-columns:minmax(0,1fr);gap:20px}.chao .zh{font-size:30px}}
/* mục */
.kh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:21px;font-weight:800;margin:38px 0 12px}.kh .zh{color:var(--do);font-size:25px}
/* sổ tay số liệu */
.so-tay{position:relative;background:var(--giay);border-radius:20px;box-shadow:var(--shadow);padding:26px 24px 22px;border:1.5px dashed color-mix(in srgb,var(--do) 35%,transparent)}
.so-tay .tieu{position:absolute;left:20px;top:-13px;background:var(--do);color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:3px 12px;letter-spacing:.02em}
.so-tay .tieu .zh{font-size:14px;margin-right:4px}
.so-tay ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.so-tay li{padding:2px 18px;border-left:2px dashed color-mix(in srgb,var(--ink) 14%,transparent);display:grid;align-content:start;gap:2px}
.so-tay li:first-child{border-left:0;padding-left:2px}
.so-tay .nhan{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;font-size:12px;font-weight:700;color:var(--muted)}.so-tay .nhan .zh{font-size:19px;color:var(--do);white-space:nowrap}
.so-tay .so{font-family:"ZCOOL KuaiLe",var(--vi),sans-serif;font-size:46px;line-height:1.05;color:var(--ink);white-space:nowrap}
.so-tay .so small{font-family:var(--vi),sans-serif;font-size:15px;font-weight:800;color:var(--muted);margin-left:4px}
.so-tay li>span:last-child{font-size:13px;color:var(--muted);line-height:1.45}
@media (max-width:900px){.so-tay ul{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.so-tay li:nth-child(3){border-left:0;padding-left:2px}}
@media (max-width:420px){.so-tay{padding:24px 16px 18px}.so-tay li{padding:2px 10px}.so-tay .so{font-size:36px}.so-tay .so small{font-size:13px}}
/* thẻ hành lý từ khoá */
.the-hanh{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.the-hanh button{position:relative;display:flex;align-items:center;gap:8px;border:0;background:#FBF1CF;color:#3A2E1E;border-radius:6px 14px 14px 6px;padding:6px 12px 6px 24px;font:inherit;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:transform .15s}
.the-hanh button:nth-child(2){rotate:1.5deg}.the-hanh button:nth-child(3){rotate:-1deg}
.the-hanh button:hover{transform:translateY(-2px)}
.the-hanh button::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ground);box-shadow:inset 0 0 0 1.5px #C9A44A}
.the-hanh .zh{font-size:22px;color:#B0352F;line-height:1.1}.the-hanh b{display:block;font-size:12.5px}.the-hanh small{display:block;font-size:11.5px;color:#7A6A50}
/* thanh 12 tháng */
.thang{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:0 0 16px}
.thang em{grid-row:1;grid-column:9/11;justify-self:center;font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:#C99A1E;border-radius:99px;padding:1px 10px;margin-bottom:5px;white-space:nowrap;position:relative}
.thang em::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#C99A1E}
.thang span{grid-row:2;height:32px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--c);opacity:.78}
.thang span.dep{opacity:1;box-shadow:0 0 0 2px var(--ground),0 0 0 4px #C99A1E;position:relative;z-index:1}
.thang span:nth-child(2){border-radius:10px 0 0 10px}.thang span:last-child{border-radius:0 10px 10px 0}
@media (max-width:420px){.thang span{font-size:10.5px;height:28px}}
/* 4 mùa */
.mua{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mua>div{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.mua .canh{position:relative;height:88px}.mua .canh svg{position:absolute;inset:0;width:100%;height:100%}
.mua .canh .zh{position:absolute;left:12px;bottom:6px;font-size:40px;line-height:1;color:var(--c);text-shadow:0 2px 0 rgba(255,255,255,.8)}
.mua .than{padding:12px 14px 14px;display:grid;align-content:start;gap:6px}
.mua .ten{font-weight:800;font-size:15px}
.mua .nd{justify-self:start;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:99px;padding:2px 10px}
.mua p{margin:0;font-size:13.5px;line-height:1.55}
.mua .muc{justify-self:start;font-size:11.5px;font-weight:800;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:1px 9px}
.mua .dep{box-shadow:0 0 0 3px #C99A1E,var(--shadow)}
.mua .dep .muc{background:#C99A1E;border-color:#C99A1E;color:#fff}
@media (max-width:900px){.mua{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.mua{grid-template-columns:minmax(0,1fr)}}
/* lưu ý */
.kh3{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;font-size:16px;font-weight:800}.kh3 .zh{color:var(--do);font-size:20px}
.luu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.luu>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.luu i{grid-row:span 2;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}.luu i .lli{width:21px;height:21px}
.luu b{font-size:14.5px}.luu p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
@media (max-width:820px){.luu{grid-template-columns:minmax(0,1fr)}}
/* bản đồ */
.ban-do-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center}
.ban-do{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#F3EAD6;box-shadow:0 14px 34px rgba(60,40,10,.18),var(--shadow);border:6px solid #FFFDF8;outline:1.5px solid #E2CFA6}
@media (prefers-reduced-motion:no-preference){.o-day{animation:nhip 1.8s ease-in-out infinite;transform-origin:290px 203px;transform-box:view-box}}
@keyframes nhip{50%{transform:scale(1.35)}}
.ban-do>svg{position:absolute;inset:0;width:100%;height:100%}
.ghim{position:absolute;translate:-50% -100%;display:grid;justify-items:center;gap:2px;border:0;background:none;padding:0;font:inherit;cursor:pointer;color:#2B2E45}
.ghim i{width:34px;height:34px;border-radius:50% 50% 50% 0;rotate:-45deg;display:grid;place-items:center;background:var(--c);box-shadow:0 3px 6px rgba(0,0,0,.25);border:2px solid #fff}
.ghim i .lli{rotate:45deg;width:17px;height:17px;color:#fff}
.ghim span{background:#FFFDF8;border-radius:99px;padding:1px 9px 1px 3px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(60,40,10,.22);line-height:1.35;display:flex;align-items:center;gap:4px;border:1.5px solid var(--c)}
.ghim span b{font-family:var(--kai);font-weight:400;font-size:14px;color:#fff;background:var(--c);border-radius:99px;padding:0 6px}
.ghim.soon{opacity:.6;cursor:default}
.ghim.xong i{box-shadow:0 0 0 3px #E0A800,0 3px 6px rgba(0,0,0,.25)}
.ghim:not(.soon):hover i,.ghim:not(.soon):focus-visible i{scale:1.12}
@media (prefers-reduced-motion:no-preference){.ghim.moi i{animation:nay 1.6s ease-in-out infinite}}
@keyframes nay{50%{translate:0 -4px}}
.ds{display:grid;gap:8px}
.ds h3{margin:4px 0 2px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ds a,.ds div.muc{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
.ds .muc{opacity:.6}
.ds .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}.ds .dot .lli{width:16px;height:16px}
.ds b{font-family:var(--kai);font-weight:400;font-size:21px}.ds small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.ds .tt{display:inline-block;margin-top:2px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}.ds a .tt{color:#fff;background:var(--do);border-radius:99px;padding:0 8px}
#dsTq,#dsTn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ds a,.ds div.muc{align-items:flex-start;padding:9px 10px;gap:8px}.ds .dot{width:26px;height:26px}.ds .dot .lli{width:14px;height:14px}.ds b{font-size:19px;line-height:1.15}.ds small{font-size:11px}
.tien-do b{font-family:inherit;font-size:14.5px}
.tien-do{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-size:13.5px}
.tien-do .vach{height:8px;border-radius:99px;background:var(--ground2);margin-top:8px;overflow:hidden}.tien-do .vach i{display:block;height:100%;background:linear-gradient(90deg,var(--do),#E0A800)}
@media (max-width:900px){.ban-do-wrap{grid-template-columns:minmax(0,1fr)}#dsTq,#dsTn{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){#dsTq,#dsTn{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ban-do{border-width:4px}.chu-ga{display:none}.ghim i{width:26px;height:26px}.ghim i .lli{width:13px;height:13px}.ghim span{font-size:0;padding:0;gap:0;border:0}.ghim span b{font-size:12px;padding:0 5px}}
.nhap{display:inline-block;margin:6px 0 0;font-size:12.5px;font-weight:700;color:#8A5A00;background:#FBF1CF;border-radius:10px;padding:4px 10px}

/* dấu thành phố + nút đi tiếp */
.btn.m{background:var(--do);color:#fff}
.dau-tp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--giay);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);margin-top:18px;border:2px dashed color-mix(in srgb,var(--do) 35%,transparent)}
.dau-tp svg.dau-c{width:92px;height:92px;transform:rotate(-12deg)}
.dau-tp b{display:block;font-size:17px}.dau-tp p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.dau-tp .sao3{display:flex;gap:3px;color:#E0A800;margin:2px 0}.dau-tp .sao3 .lli{width:20px;height:20px}.dau-tp .sao3 .rong{color:var(--faint)}
.dau-tp .hang{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:520px){.dau-tp{grid-template-columns:minmax(0,1fr);justify-items:start}.dau-tp svg.dau-c{width:76px;height:76px}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const ic=n=>'<svg class="lli" aria-hidden="true"><use href="/chung/ic.svg?v=4faa8901#'+n+'"></use></svg>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const bia=$('#bia');
bia.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=bia.getBoundingClientRect();bia.style.setProperty('--mx',((e.clientX-r.left)/r.width*2-1).toFixed(3));bia.style.setProperty('--my',((e.clientY-r.top)/r.height*2-1).toFixed(3));bia.classList.add('t3')});
bia.addEventListener('pointerleave',()=>{bia.classList.remove('t3');bia.style.removeProperty('--mx');bia.style.removeProperty('--my')});
const r=document.documentElement,tb=$('#themeBtn');
const cur=()=>r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const paint=()=>{tb.innerHTML=ic(cur()==='dark'?'mattroi':'trang')};
tb.addEventListener('click',()=>{r.dataset.theme=cur()==='dark'?'light':'dark';try{localStorage.setItem('cb-theme',r.dataset.theme)}catch(e){};paint()});
paint();
})();
