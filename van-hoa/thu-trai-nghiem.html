<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trải nghiệm Bắc Kinh – 文化盒</title>
<link rel="icon" href="../img/logo-hallo-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="../tro-choi/game.css?v=4">
<script>try{const t=localStorage.getItem('cb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* BẢN THỬ 1 điểm tham quan (故宫) bằng ảnh chụp thật — chờ cô duyệt. Ảnh đang tải thẳng từ Wikimedia, chưa lưu về máy. */
:root{--do:#C8423B;--m:#C8423B;--kai:"STKaiti","KaiTi","Kaiti SC",serif;--giay:#FBF5E8;--bt:#FFFDF8;--bt-chu:#5A4636;--bt-phu:#8A7A6A}
:root[data-theme="dark"]{--giay:#2A2620;--bt:#E9DFCB;--bt-chu:#4A3A2C;--bt-phu:#6E5E4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--giay:#2A2620;--bt:#E9DFCB;--bt-chu:#4A3A2C;--bt-phu:#6E5E4E}}
[hidden]{display:none!important}
body{background:var(--ground)}
.zh{font-family:var(--kai);font-weight:400}
.duong{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:700;color:var(--muted);margin:18px 0 10px}
.duong .zh{color:var(--do);font-size:17px}.duong .lli{width:14px;height:14px}
/* các điểm của thành phố */
.diem{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.diem span{flex:none;display:grid;line-height:1.2;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--muted)}
.diem span b{font-family:var(--kai);font-weight:400;font-size:20px;color:var(--ink)}
.diem span.nay{border-color:var(--do);background:color-mix(in srgb,var(--do) 10%,var(--card))}.diem span.nay b{color:var(--do)}
.diem span.soon{opacity:.55}
.diem a{flex:none;display:grid;line-height:1.2;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--muted);text-decoration:none}.diem a b{font-family:var(--kai);font-weight:400;font-size:20px;color:var(--ink)}.diem a:hover{border-color:var(--do)}
/* bưu thiếp ảnh thật */
.dau-trang{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:8px}
.buu{position:relative;background:var(--bt);padding:10px 10px 34px;border-radius:6px;box-shadow:0 18px 40px rgba(30,20,10,.22),0 2px 6px rgba(0,0,0,.12);transform:rotate(-1.2deg);transition:transform .15s}
.buu.t3{transform:perspective(900px) rotateY(calc(var(--mx)*8deg)) rotateX(calc(var(--my)*-7deg))}
.buu .khung{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:3px;background:#cfd9e2}
.buu img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transition:transform .2s ease-out,filter .4s}
/* chỉnh màu chung cho mọi ảnh: ấm, hơi giống ảnh in bưu thiếp, góc tối nhẹ */
.buu.am img{filter:sepia(.18) saturate(1.06) contrast(1.04) brightness(1.03)}
.buu .khung::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(70,40,10,.28) 100%),linear-gradient(180deg,rgba(255,214,150,.10),rgba(255,170,90,.12));mix-blend-mode:multiply}
.buu.am .khung::before{opacity:1}
.so-sanh{display:inline-flex;margin:14px 0 0;background:var(--card);border-radius:99px;padding:3px;box-shadow:var(--shadow);gap:2px}
.so-sanh button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:99px;cursor:pointer}
.so-sanh button[aria-pressed="true"]{background:var(--do);color:#fff}
.buu.t3 img{transform:translate(calc(var(--mx)*-10px),calc(var(--my)*-7px))}
.buu .khung::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at calc(50% + var(--mx,0)*45%) calc(35% + var(--my,0)*45%),rgba(255,255,255,.28),transparent 55%)}
.buu .chu-tay{position:absolute;left:16px;bottom:8px;font-family:var(--kai);font-size:17px;color:var(--bt-chu)}
.buu .nguon{position:absolute;right:12px;bottom:10px;font-size:10px;color:var(--bt-phu);max-width:58%;text-align:right;line-height:1.25}
.buu .nguon a{color:inherit}
.buu .tem{position:absolute;right:-14px;top:-16px;width:74px;transform:rotate(7deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.buu .moc{position:absolute;left:-18px;top:-20px;width:120px;opacity:.85;transform:rotate(-12deg);pointer-events:none}
.gt h1{margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:22px}
.gt h1 .zh{font-size:54px;color:var(--do);line-height:1}
.gt .py{font-weight:700;color:var(--muted);margin:4px 0 10px}
.gt p{margin:0 0 14px;font-size:15.5px;line-height:1.6}
.the-nho{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.the-nho span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}.the-nho .lli{width:15px;height:15px;color:var(--do)}
@media (max-width:820px){.dau-trang{grid-template-columns:minmax(0,1fr);gap:22px}.buu{margin:6px 8px 0}.gt h1 .zh{font-size:44px}}
@media (max-width:520px){.buu{padding-bottom:50px}.buu .chu-tay{bottom:26px}.buu .nguon{left:16px;right:auto;bottom:8px;max-width:none;text-align:left;font-size:9.5px}}
@media (max-width:420px){.buu .tem{width:58px;right:-8px}.buu .moc{width:92px}}
/* cẩm nang */
.kh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:21px;font-weight:800;margin:36px 0 12px}.kh .zh{color:var(--do);font-size:25px}
/* cẩm nang: thẻ lật */
.cam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cam-goi{font-size:13.5px;color:var(--muted);margin:-4px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cam-goi b{color:var(--do)}
.the{position:relative;border:0;padding:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;perspective:1000px;min-height:318px}
.the .mat{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow);transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.the .sau{transform:rotateY(180deg);background:var(--card);border-top:6px solid var(--c);padding:16px 16px 14px;display:grid;align-content:start;gap:8px}
.the.lat .truoc{transform:rotateY(-180deg)}.the.lat .sau{transform:rotateY(0)}
.the .truoc{display:grid;grid-template-rows:1fr auto;background:var(--card)}
.the .hinh{position:relative;overflow:hidden;background:#3b3026}.the .hinh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.14) saturate(1.05) contrast(1.04);transform:scale(var(--z,1));transition:transform .4s}
.the:hover .hinh img{transform:scale(calc(var(--z,1)*1.05))}
.the .hinh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.45))}
.the .hinh .chu{z-index:1}
.the .nguon-the{display:block;font-size:10px;color:var(--muted);line-height:1.3}.the .nguon-the a{color:inherit}
.the:focus-visible{outline:3px solid var(--c);outline-offset:3px;border-radius:18px}
.the .hinh .chu{position:absolute;right:12px;bottom:-6px;font-family:var(--kai);font-size:76px;line-height:1;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.25);opacity:.95}
.the .ten-the{padding:12px 14px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.the .ten-the b{font-size:15px}.the .ten-the small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.the .lat-nut{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:99px;padding:3px 10px}
.the .lat-nut .lli{width:13px;height:13px}
.the .sau .t3{font-weight:800;font-size:15px;color:var(--c);display:flex;align-items:center;gap:6px}
.the .sau .p{display:block;font-size:13px;line-height:1.55}
.the .tu-the{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--giay);border-radius:12px;padding:6px 10px}
.the .tu-the .zh{font-size:22px;color:var(--c);white-space:nowrap}.the .tu-the>span:nth-child(2){flex:1;min-width:0}.the .tu-the b{font-size:13px}.the .tu-the small{display:block;font-size:11.5px;color:var(--muted)}
.the .da-doc{position:absolute;right:10px;top:10px;z-index:2;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--mint);display:none;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}.the .da-doc .lli{width:14px;height:14px}
.the.doc .truoc .da-doc{display:grid}
.the:hover .truoc{transform:translateY(-3px)}.the.lat:hover .truoc{transform:rotateY(-180deg)}
@media (prefers-reduced-motion:reduce){.the .mat{transition:none}}
@media (max-width:980px){.cam{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cam{gap:12px;grid-template-columns:minmax(0,1fr)}.the{min-height:278px}.the .hinh .chu{font-size:60px}}
/* câu đố */
.qz{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.qz-dau{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(90deg,#8E2A2A,#C8423B);color:#fff}
.buoc{flex:1;display:flex;align-items:center;min-width:0}
.buoc i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5)}
.buoc i .lli{width:15px;height:15px}
.buoc i.nay{background:#fff;color:#C8423B;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.buoc i.dung{background:#4CAF7A;border-color:#fff}.buoc i.sai{background:#5A1A16;border-color:rgba(255,255,255,.6)}
.buoc s{flex:1;height:3px;background:rgba(255,255,255,.35);text-decoration:none;min-width:8px}
.tui{flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
.tui .lli{width:16px;height:16px}
.tui.nhay{animation:nhay .5s}
@keyframes nhay{40%{transform:scale(1.25)}}
.qz-than{padding:20px 22px 22px;position:relative}
.qz .loai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--do);background:color-mix(in srgb,var(--do) 12%,transparent);border-radius:99px;padding:3px 11px}.qz .loai .lli{width:14px;height:14px}
.qz .hoi{font-size:20px;font-weight:700;line-height:1.5;margin:12px 0 16px}.qz .hoi .zh{font-size:1.3em;color:var(--do)}
.qz .hoi .o-trong{display:inline-block;width:1.1em;border-bottom:3px solid var(--do);margin:0 2px;animation:chop 1s steps(2) infinite}
@keyframes chop{50%{border-color:transparent}}
.anh-hoi{position:relative;height:210px;max-width:620px;border-radius:16px;margin:4px 0 14px;background-repeat:no-repeat;box-shadow:inset 0 0 0 4px var(--bt);border:2px dashed var(--line)}
.anh-hoi span{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}.anh-hoi .lli{width:14px;height:14px}
.chon{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chon.ba{grid-template-columns:repeat(3,1fr)}
.chon button{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;font-weight:700;font-size:15.5px;padding:12px 14px;border-radius:16px;cursor:pointer;min-height:58px;transition:transform .15s,border-color .15s,box-shadow .15s}
.chon button .nhan{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--k);color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 0 color-mix(in srgb,var(--k) 60%,#000)}
.chon button .zh{font-size:30px;line-height:1.1}
.chon button:not(:disabled):hover{border-color:var(--k);transform:translateY(-2px);box-shadow:0 6px 14px color-mix(in srgb,var(--k) 25%,transparent)}
.chon button.dung{border-color:var(--mint);background:var(--mint-s)}.chon button.dung .nhan{background:var(--mint)}
.chon button.sai{border-color:var(--do);background:var(--coral-s);animation:lac .35s}
.chon button:disabled:not(.dung):not(.sai){opacity:.45}
.chon.ba button{flex-direction:column;justify-content:center;text-align:center;gap:6px}
@keyframes lac{25%{translate:-6px 0}75%{translate:6px 0}}
@media (max-width:560px){.chon{grid-template-columns:1fr}.chon.zhc{grid-template-columns:1fr 1fr}.qz-than{padding:16px}.qz .hoi{font-size:18px}.qz-dau{padding:12px 14px;gap:10px}.buoc i{width:26px;height:26px;font-size:12px}.anh-hoi{height:150px}}
.biet{margin-top:16px;border-radius:18px;overflow:hidden;border:2px solid var(--kc);animation:len .35s ease-out}
@keyframes len{from{opacity:0;transform:translateY(10px)}}
.biet .kq{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--kc);color:#fff;font-weight:800;font-size:16px}.biet .kq .lli{width:22px;height:22px}
.biet .nd{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--giay)}
.biet p{margin:0;font-size:14.5px;line-height:1.6}
.tem-tu{position:relative;display:grid;justify-items:center;gap:1px;padding:12px 16px 10px;background:#FFFDF8;color:#2B2E45;min-width:100px;transform:rotate(3deg);box-shadow:0 4px 10px rgba(0,0,0,.18);outline:5px dotted var(--giay);outline-offset:-2px;border:1px dashed #E2CFA6}
.tem-tu .zh{font-size:30px;color:#C8423B;line-height:1.1}.tem-tu b{font-size:12.5px}.tem-tu small{font-size:11px;color:#6B6F84}
.tem-tu .spk{margin-top:4px;width:28px;height:28px;background:#F1E9D8;color:#2B2E45}
.biet .hang{display:flex;justify-content:flex-end;gap:10px;padding:0 16px 14px;background:var(--giay)}
@media (max-width:560px){.biet .nd{grid-template-columns:minmax(0,1fr)}.tem-tu{justify-self:start}}
.phao{position:absolute;left:50%;top:40%;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:phao .9s ease-out forwards}
@keyframes phao{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.qz-mo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:22px}
.qz-mo>svg{width:120px;height:auto}
.qz-mo h3{margin:0 0 6px;font-size:19px}.qz-mo p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.55}
@media (max-width:520px){.qz-mo{grid-template-columns:minmax(0,1fr);justify-items:start}.qz-mo>svg{width:96px}}
.spk{border:0;background:var(--ground2);color:var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.spk .lli{width:17px;height:17px}
.btn.m{background:var(--do);color:#fff}
.ve-tq{text-align:center;padding:26px 18px}
.ve-tq svg.ve-to{width:min(320px,100%);height:auto;transform:rotate(-3deg)}
.ve-tq h2{margin:10px 0 4px}
.sao-kq{display:flex;justify-content:center;gap:6px;color:#E0A800;margin:8px 0}.sao-kq .lli{width:34px;height:34px}.sao-kq .rong{color:var(--faint)}
.tui-kq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 0}
.tui-kq span{background:var(--giay);border-radius:12px;padding:5px 12px;display:grid;line-height:1.25;box-shadow:var(--shadow)}
.tui-kq b{font-family:var(--kai);font-weight:400;font-size:21px;color:var(--do)}.tui-kq small{font-size:11px;color:var(--muted)}
.nhap{display:inline-block;margin:6px 0 0;font-size:12.5px;font-weight:700;color:#8A5A00;background:#FBF1CF;border-radius:10px;padding:4px 10px}

/* ===== trải nghiệm */
.tn-khung{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.tn-than{padding:20px 22px 22px;position:relative}
@media (max-width:560px){.tn-than{padding:16px}}
/* 吃: gọi món */
.khach{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.khach .mat-k{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#FBE3C9;color:#C8423B}.khach .mat-k .lli{width:28px;height:28px}
.bong{position:relative;background:var(--giay);border-radius:18px;padding:12px 16px;max-width:100%;box-shadow:var(--shadow)}
.bong::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-left:0;border-right-color:var(--giay)}
.bong .zh{display:block;font-size:24px;line-height:1.35;color:var(--ink)}
.bong .py{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.bong .goi-y{margin-top:6px;border:0;background:none;color:var(--do);font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}.bong .goi-y .lli{width:14px;height:14px}
.bong .vi{display:block;font-size:14px;margin-top:4px}
.thuc-don{background:#FBF5E8;border:3px double #B0352F;border-radius:16px;padding:14px;color:#2B2E45}
.thuc-don h3{margin:0 0 10px;text-align:center;font-family:var(--kai);font-weight:400;font-size:26px;color:#B0352F;letter-spacing:.3em}
.mon-luoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mon{position:relative;display:grid;border:2px solid #E2CFA6;background:#fff;border-radius:14px;overflow:hidden;padding:0;cursor:pointer;font:inherit;color:#2B2E45;text-align:left;transition:transform .15s,border-color .15s}
.mon:not(:disabled):hover{transform:translateY(-2px);border-color:#C8423B}
.mon img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;filter:sepia(.1) saturate(1.05)}
.mon span{padding:6px 9px 8px;display:grid;line-height:1.25}
.mon b{font-family:var(--kai);font-weight:400;font-size:21px}.mon small{font-size:11.5px;color:#6B6F84}
.mon em{position:absolute;right:6px;top:6px;font-style:normal;background:#B0352F;color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:1px 8px}
.mon.dung{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}.mon.sai{border-color:var(--do);animation:lac .35s}
.mon:disabled:not(.dung):not(.sai){opacity:.5}
@media (max-width:560px){.mon-luoi{grid-template-columns:repeat(2,minmax(0,1fr))}.bong .zh{font-size:21px}}
/* 说: chat taxi */
.chat{display:grid;gap:12px;margin-bottom:14px}
.dong-chat{display:flex;gap:10px;align-items:flex-end}
.dong-chat .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#F2C744;color:#2B2E45;font-family:var(--kai);font-size:18px}
.dong-chat.toi{justify-content:flex-end}
.dong-chat.toi .bong{background:#2F7FA0;color:#fff}.dong-chat.toi .bong::before{display:none}
.dong-chat.toi .bong .zh{color:#fff}
.dong-chat .bong .spk{display:inline-grid;vertical-align:middle;margin-left:6px;width:28px;height:28px}
.hoi-chat{font-weight:800;margin:4px 0 10px;font-size:15px}
.tra-loi{display:grid;gap:10px}
.tra-loi button{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:11px 14px;border-radius:16px;cursor:pointer;text-align:left}
.tra-loi button .zh{font-size:22px}
.tra-loi button .nhan{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--k);color:#fff;font-weight:800;font-size:13px}
.tra-loi button:not(:disabled):hover{border-color:var(--k)}
.tra-loi button.dung{border-color:var(--mint);background:var(--mint-s)}.tra-loi button.sai{border-color:var(--do);background:var(--coral-s);animation:lac .35s}
.tra-loi button:disabled:not(.dung):not(.sai){opacity:.45}
/* 住: nhà tứ hợp viện */
.nha-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.nha{width:100%;height:auto;display:block;background:#EFE6D2;border-radius:18px;border:4px solid #FFFDF8;box-shadow:var(--shadow)}
.nha [data-k]{cursor:pointer;transition:filter .15s}
.nha [data-k]:hover,.nha [data-k]:focus-visible{filter:brightness(1.12) drop-shadow(0 0 4px #E0A800);outline:none}
.nha [data-k].da .nhan-k{opacity:1}
.nha .nhan-k{opacity:0;transition:opacity .3s;pointer-events:none}
.nha [data-k].chon{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #E0A800) brightness(1.1)}
.nha [data-k].dung{filter:drop-shadow(0 0 6px #4CAF7A) brightness(1.1)}.nha [data-k].sai{filter:drop-shadow(0 0 6px #C8423B)}
.thong-tin{background:var(--giay);border-radius:18px;padding:16px;min-height:150px}
.thong-tin h3{margin:0 0 4px;display:flex;align-items:baseline;gap:8px}.thong-tin h3 .zh{font-size:30px;color:var(--do)}
.thong-tin p{margin:6px 0 0;font-size:14.5px;line-height:1.55}
.dem-kham{margin:12px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:820px){.nha-wrap{grid-template-columns:minmax(0,1fr)}}
/* 俗: ghép */
.ghep{display:grid;gap:16px}
.ghep-anh{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ghep-anh button{position:relative;border:3px solid transparent;border-radius:14px;overflow:hidden;padding:0;cursor:pointer;background:#000;aspect-ratio:3/4}
.ghep-anh img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.1)}
.ghep-anh button.chon{border-color:#E0A800;transform:translateY(-3px)}
.ghep-anh button.xong{border-color:var(--c);cursor:default}
.ghep-anh button .so-cap{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:none;place-items:center;font-size:13px}
.ghep-anh button.xong .so-cap{display:grid}
.ghep-ten{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ghep-ten button{display:grid;justify-items:center;line-height:1.2;border:2px solid #B0352F;background:#FFF4D6;color:#2B2E45;border-radius:8px;padding:8px 16px;cursor:pointer;font:inherit;box-shadow:0 4px 0 #8E2A2A;min-width:96px}
.ghep-ten button .zh{font-size:24px;color:#B0352F}.ghep-ten button small{font-size:11.5px;color:#6B6F84}
.ghep-ten button.xong{background:var(--c);border-color:var(--c);box-shadow:none;cursor:default}.ghep-ten button.xong .zh,.ghep-ten button.xong small{color:#fff}
.ghep-ten button.sai{animation:lac .35s;border-color:var(--do)}
.ghep-goi{text-align:center;font-weight:700;color:var(--muted);font-size:14px;margin:0}
.ghep-tt{display:grid;gap:8px}
.ghep-tt p{margin:0;background:var(--giay);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;border-left:5px solid var(--c)}
.ghep-tt p b{font-family:var(--kai);font-weight:400;font-size:19px;color:var(--c);margin-right:4px}
@media (max-width:640px){.ghep-anh{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const ic=n=>'<svg class="lli" aria-hidden="true"><use href="/chung/ic.svg?v=c0a8a094#'+n+'"></use></svg>';
const am=n=>{try{window.AM&&AM.play(n)}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xao=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const MAU=['#C8423B','#C99A1E','#2F7FA0','#5E9A45','#8E5AA8'];
const BJ=window.VH_BJ,ID=(new URLSearchParams(location.search).get('d')||'chi').replace(/[^a-z]/g,''),D=BJ.tn[ID]||BJ.tn.chi,DID=BJ.tn[ID]?ID:'chi';
const LIC=l=>/CC0/.test(l)?'https://creativecommons.org/publicdomain/zero/1.0/':'https://creativecommons.org/licenses/'+(/SA/.test(l)?'by-sa':'by')+'/'+(l.match(/[\d.]+/)||['4.0'])[0];
const nguon=(a,ten)=>'Ảnh: '+esc(a[3])+' · <a href="'+LIC(a[2])+'" target="_blank" rel="noopener">'+a[2]+'</a> · <a href="'+a[1]+'" target="_blank" rel="noopener">'+(ten||'Wikimedia')+'</a>';
const linkDiem=d=>BJ.tq[d.id]?'thu-diem.html?d='+d.id:BJ.tn[d.id]?'thu-trai-nghiem.html?d='+d.id:'';

// ---- phần đầu trang
document.title=D.zh+' · '+D.vi+' – 文化盒';
$('#duong').innerHTML='<span class="zh">华北线</span>Tuyến Hoa Bắc'+ic('sau')+'<a href="thu-thanh-pho.html#ban-do" style="color:inherit;text-decoration:none"><span class="zh">北京</span>Bắc Kinh</a>'+ic('sau')+D.zh+' '+D.vi;
$('#chips').innerHTML=BJ.diem.map(d=>{const l=linkDiem(d);return l&&d.id!==DID?'<a href="'+l+'"><b>'+d.zh+'</b>'+(d.ngan||d.vi)+'</a>':'<span class="'+(d.id===DID?'nay':'soon')+'"><b>'+d.zh+'</b>'+(d.ngan||d.vi)+'</span>'}).join('');
$('#heroImg').src=D.anh[0];$('#heroImg').alt=D.alt;$('#chuTay').textContent=D.chuTay;$('#heroNguon').innerHTML=nguon(D.anh,'Wikimedia Commons');
$('#tem').outerHTML='<svg class="tem" viewBox="0 0 80 96" aria-hidden="true"><path d="M4 0h72v96H4z" fill="var(--bt)"/><g fill="var(--ground,#eee)">'+[8,20,32,44,56,68,80,92].map(y=>'<circle cx="4" cy="'+y+'" r="3"/><circle cx="76" cy="'+y+'" r="3"/>').join('')+'</g><rect x="11" y="8" width="58" height="80" fill="#2F7FA0"/><circle cx="40" cy="54" r="16" fill="#F2C14E"/><text x="40" y="61" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="20" fill="#2F5F80">'+D.zh+'</text><text x="40" y="30" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="13" fill="#FBE7A1">体验</text><text x="40" y="84" text-anchor="middle" font-family="Be Vietnam Pro,sans-serif" font-weight="800" font-size="8" fill="#FBE7A1">文化盒</text></svg>';
$('#ten').innerHTML='<span class="zh">'+D.zh+'</span>'+D.vi;
$('#py').innerHTML=D.py+' · '+D.ten2+' <button class="spk" type="button" data-say="'+D.zh+'" aria-label="Nghe" style="display:inline-grid;vertical-align:middle;margin-left:6px">'+ic('loa')+'</button>';
$('#gioi').textContent=D.gioi;
$('#nhan').innerHTML=D.nhan.map(x=>'<span>'+ic(x[0])+x[1]+'</span>').join('');
$('#batDau').innerHTML=ic('phat')+D.nut;$('#tenTn').textContent=D.vi;

// ---- khung chung: thanh bước + túi từ, phản hồi, vé
let n=0,dung=0,sai=0,kq=[],tui=[],TONG=0;
const dauTn=()=>'<div class="qz-dau"><div class="buoc">'+[...Array(TONG)].map((_,i)=>(i?'<s></s>':'')+'<i class="'+(kq[i]===true?'dung':kq[i]===false?'sai':i===n?'nay':'')+'">'+(kq[i]===true?ic('tick'):kq[i]===false?ic('sai'):i+1)+'</i>').join('')+'</div><span class="tui" id="tui">'+ic('sotay')+tui.length+' từ</span></div>';
const capDau=()=>{const d=$('.qz-dau');if(d)d.outerHTML=dauTn()};
function phao(){const t=$('.tn-than');if(!t||matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<16;i++){const p=document.createElement('i');p.className='phao';p.style.cssText='background:'+MAU[i%5]+';--x:'+((Math.random()-.5)*360|0)+'px;--y:'+((Math.random()-.8)*220|0)+'px;--r:'+(Math.random()*540|0)+'deg';t.append(p);setTimeout(()=>p.remove(),950)}}
// ghi kết quả 1 bước, hiện ô Biết thêm + tem từ; tiep() khi bấm nút
function phanHoi(ok,x,k,cuoi,tiep,noi){
  kq[n]=ok;if(ok){dung++;if(k)tui.push(k);am('coin');phao()}else{sai++;am('hurt')}
  capDau();if(ok)$('#tui').classList.add('nhay');
  const o=noi||$('#biet');
  o.innerHTML='<div class="biet" style="--kc:'+(ok?'var(--mint)':'var(--do)')+'"><div class="kq">'+ic(ok?'dung-tron':'sai-tron')+(ok?['Chính xác!','Giỏi quá!','Chuẩn người Bắc Kinh!'][Math.random()*3|0]+(k?' +1 tem từ mới':''):'Chưa đúng rồi')+'</div>'+
    '<div class="nd"><p>'+x+'</p>'+(k?'<span class="tem-tu"><span class="zh">'+k[0]+'</span><b>'+k[1]+'</b><small>'+k[2]+'</small>'+(window.TTS&&TTS.can(k[0])?'<button class="spk" type="button" data-say="'+k[0]+'" aria-label="Nghe">'+ic('loa')+'</button>':'')+'</span>':'')+'</div>'+
    '<div class="hang"><button class="btn m" type="button" id="tiep">'+(cuoi?'Nhận vé trải nghiệm':'Tiếp tục')+ic('sau')+'</button></div></div>';
  $('#tiep').focus({preventScroll:true});$('#tiep').onclick=()=>{if(cuoi)ket();else{n++;tiep()}};
}
function ket(){
  const sao=D.loai==='ghep'?(sai<=1?3:sai<=3?2:1):(dung===TONG?3:dung>=TONG*.8?2:dung>=TONG*.6?1:0);
  am(sao?'win':'lose');
  $('#khung').innerHTML=(D.loai==='ghep'?'':dauTn())+'<div class="ve-tq">'+(sao?
    '<svg class="ve-to" viewBox="0 0 320 130" aria-hidden="true"><rect x="2" y="2" width="316" height="126" rx="10" fill="#EEF6FA" stroke="#2F7FA0" stroke-width="3"/><path d="M226 2v126" stroke="#2F7FA0" stroke-width="2" stroke-dasharray="5 5"/><text x="20" y="34" font-family="Be Vietnam Pro,sans-serif" font-weight="800" font-size="12" fill="#2F7FA0">体验券 · VÉ TRẢI NGHIỆM</text><text x="20" y="86" font-family="STKaiti,KaiTi,serif" font-size="50" fill="#2B2E45">'+D.zh+'</text><text x="76" y="84" font-family="Be Vietnam Pro,sans-serif" font-weight="800" font-size="13" fill="#2B2E45">'+esc(D.vi)+'</text><text x="20" y="112" font-family="Be Vietnam Pro,sans-serif" font-weight="700" font-size="12" fill="#6B6F84">北京 · 体验 Trải nghiệm</text><g transform="translate(272 64) rotate(-14)"><circle r="34" fill="none" stroke="#2F7FA0" stroke-width="3"/><circle r="27" fill="none" stroke="#2F7FA0" stroke-width="1.2" stroke-dasharray="3 3"/><text y="7" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="20" fill="#2F7FA0">已体验</text></g></svg>'+
    '<h2>Hoàn thành: '+esc(D.vi)+'!</h2><div class="sao-kq">'+[0,1,2].map(i=>ic(i<sao?'sao':'sao-rong').replace('class="lli"','class="lli'+(i<sao?'':' rong')+'"')).join('')+'</div><p style="color:var(--muted);margin:0">'+(D.loai==='ghep'?(sai?'Ghép sai '+sai+' lần':'Không ghép sai lần nào'):'Đúng '+dung+'/'+TONG)+' · đã ghi vào bản đồ Bắc Kinh</p>':
    '<h2>Chưa qua được rồi</h2><p style="color:var(--muted);margin:0">Đúng '+dung+'/'+TONG+'. Thử lại nhé!</p>')+
    (tui.length?'<div class="tui-kq">'+tui.map(k=>'<span><b>'+k[0]+'</b><small>'+k[1]+' · '+k[2]+'</small></span>').join('')+'</div>':'')+
    '<div class="hang" style="justify-content:center;margin-top:16px">'+(sao?'<a class="btn m" href="thu-thanh-pho.html#ban-do">'+ic('truoc')+'Về bản đồ Bắc Kinh</a>':'')+'<button class="btn sec" type="button" id="lai">'+ic('lai')+'Chơi lại</button></div></div>';
  if(sao)try{const x=JSON.parse(localStorage.getItem('vh-thu-diem'))||{};x[DID]=1;localStorage.setItem('vh-thu-diem',JSON.stringify(x))}catch(e){}
  $('#lai').onclick=batDau;
}

// ---- 吃: đọc yêu cầu của khách, chọn món trên thực đơn
function choiMenu(){
  const q=D.don[n],M=D.mon;
  $('#khung').innerHTML=dauTn()+'<div class="tn-than"><div class="khach"><span class="mat-k">'+ic('mat-cuoi')+'</span><div class="bong"><span class="zh">'+q.zh+'</span><span class="py">'+q.py+'</span>'+
    '<button class="goi-y" type="button" id="goiY">'+ic('mat')+'Xem nghĩa</button><span class="vi" id="viK" hidden>'+q.vi+'</span>'+(window.TTS&&TTS.can(q.zh)?' <button class="spk" type="button" data-say="'+q.zh+'" aria-label="Nghe" style="display:inline-grid;vertical-align:middle;width:28px;height:28px">'+ic('loa')+'</button>':'')+'</div></div>'+
    '<div class="thuc-don"><h3>菜单</h3><div class="mon-luoi" id="mon">'+M.map(m=>'<button type="button" class="mon" data-id="'+m.id+'"><img src="'+m.a[0]+'" alt="'+esc(m.vi)+'"><em>'+m.gia+'元</em><span><b>'+m.zh+'</b><small>'+m.py+'</small></span></button>').join('')+'</div></div>'+
    '<p style="font-size:11px;color:var(--muted);margin:8px 0 0">Giá trong trò chơi chỉ để luyện đọc số. Ảnh món ăn: '+M.map(m=>esc(m.a[3])+' (<a href="'+m.a[1]+'" target="_blank" rel="noopener" style="color:inherit">'+m.a[2]+'</a>)').join(', ')+'.</p><div id="biet"></div></div>';
  $('#goiY').onclick=()=>{$('#viK').hidden=false;$('#goiY').remove()};
  $('#mon').onclick=e=>{const b=e.target.closest('.mon');if(!b||b.disabled)return;const ok=b.dataset.id===q.a,mon=M.find(m=>m.id===q.a);
    $('#mon').querySelectorAll('.mon').forEach(x=>{x.disabled=true;if(x.dataset.id===q.a)x.classList.add('dung')});if(!ok)b.classList.add('sai');
    $('#viK').hidden=false;$('#goiY')&&$('#goiY').remove();
    phanHoi(ok,'<b class="zh" style="font-size:20px;color:var(--do)">'+mon.zh+'</b> '+mon.py+' · '+mon.vi+'. '+mon.mo,q.k,n===TONG-1,choiMenu);
    $('#biet').scrollIntoView({behavior:'smooth',block:'nearest'})};
}
// ---- 说: hội thoại với bác tài
function choiChat(){
  const L=D.luot,q=L[n];
  const cu=L.slice(0,n).map((t,i)=>'<div class="dong-chat"><span class="av">师</span><div class="bong"><span class="zh">'+t.zh+'</span><span class="py">'+t.py+'</span></div></div>'+(t.hoi.startsWith('Chọn')?'<div class="dong-chat toi"><div class="bong"><span class="zh">'+t.o[t.a]+'</span></div></div>':'')).join('');
  $('#khung').innerHTML=dauTn()+'<div class="tn-than"><div class="chat">'+cu+'<div class="dong-chat"><span class="av">师</span><div class="bong"><span class="zh">'+q.zh+(window.TTS&&TTS.can(q.zh)?'<button class="spk" type="button" data-say="'+q.zh+'" aria-label="Nghe">'+ic('loa')+'</button>':'')+'</span><span class="py">'+q.py+'</span></div></div><div id="choTra"></div></div>'+
    '<p class="hoi-chat">'+q.hoi+'</p><div class="tra-loi" id="traLoi">'+xao(q.o.map((s,j)=>[s,j])).map((o,k)=>'<button type="button" data-j="'+o[1]+'" style="--k:'+MAU[k]+'"><span class="nhan">'+'ABC'[k]+'</span><span'+(/[一-鿿]/.test(o[0])?' class="zh"':'')+'>'+o[0]+'</span></button>').join('')+'</div><div id="biet"></div></div>';
  try{if(window.TTS&&TTS.can(q.zh)&&n>0)TTS.say(q.zh)}catch(e){}
  $('#traLoi').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const ok=+b.dataset.j===q.a;
    $('#traLoi').querySelectorAll('button').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('dung')});if(!ok)b.classList.add('sai');
    if(q.hoi.startsWith('Chọn'))$('#choTra').innerHTML='<div class="dong-chat toi"><div class="bong"><span class="zh">'+q.o[q.a]+'</span></div></div>';
    phanHoi(ok,'<b>'+q.vi+'</b><br>'+q.x,q.k,n===TONG-1,choiChat)};
}
// ---- 住: khám phá rồi chạm vào bản vẽ tứ hợp viện
const NHA_SVG=()=>{const K=D.khu,khu=(k,inner,lx,ly)=>'<g data-k="'+k+'" tabindex="0" role="button" aria-label="'+K[k].zh+' '+K[k].vi+'">'+inner+'<g class="nhan-k"><rect x="'+(lx-30)+'" y="'+(ly-13)+'" width="60" height="22" rx="11" fill="#FFFDF8" stroke="#B0352F" stroke-width="1.5"/><text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="15" fill="#B0352F">'+K[k].zh+'</text></g></g>';
  const mai=(x,y,w,h,ngang)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#7C8790"/>'+(ngang?[...Array(Math.floor(w/8))].map((_,i)=>'<path d="M'+(x+4+i*8)+' '+(y+3)+'v'+(h-6)+'" stroke="#5E6870" stroke-width="2"/>').join(''):[...Array(Math.floor(h/8))].map((_,i)=>'<path d="M'+(x+3)+' '+(y+4+i*8)+'h'+(w-6)+'" stroke="#5E6870" stroke-width="2"/>').join(''))+'<path d="'+(ngang?'M'+x+' '+(y+h/2)+'h'+w:'M'+(x+w/2)+' '+y+'v'+h)+'" stroke="#3E474E" stroke-width="3"/>';
  return '<svg class="nha" viewBox="0 0 400 330" aria-label="Bản vẽ nhà tứ hợp viện nhìn từ trên cao"><rect x="0" y="300" width="400" height="30" fill="#CFC3A8"/><text x="200" y="320" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="14" fill="#6E5A40">胡同 · ngõ</text>'+
   '<rect x="36" y="26" width="328" height="270" fill="none" stroke="#9A8A72" stroke-width="6"/><text x="200" y="18" text-anchor="middle" font-family="Be Vietnam Pro,sans-serif" font-weight="800" font-size="10" fill="#8A7A62">BẮC 北</text>'+
   khu('yuanzi','<rect x="132" y="112" width="136" height="122" fill="#D9E7C4"/><path d="M200 112v122M132 173h136" stroke="#C2D3A8" stroke-width="10"/><circle cx="160" cy="140" r="15" fill="#7FAF5A"/><circle cx="160" cy="140" r="7" fill="#E58AA0" opacity=".7"/><circle cx="244" cy="206" r="13" fill="#7FAF5A"/><circle cx="234" cy="140" r="9" fill="#5FB0CF" stroke="#3E7F99" stroke-width="2"/>',200,190)+
   khu('zhengfang',mai(104,38,192,58,true)+'<rect x="112" y="96" width="176" height="8" fill="#B0352F"/>',200,70)+
   khu('xiang','<g>'+mai(48,112,62,122,false)+'<rect x="110" y="120" width="8" height="106" fill="#B0352F"/>'+mai(290,112,62,122,false)+'<rect x="282" y="120" width="8" height="106" fill="#B0352F"/></g>',79,173)+
   khu('daozuo',mai(48,250,232,40,true)+'<rect x="56" y="242" width="216" height="8" fill="#B0352F"/>',150,272)+
   khu('damen','<rect x="294" y="250" width="58" height="40" fill="#7C8790"/><rect x="306" y="262" width="34" height="34" fill="#B0352F" stroke="#E0A800" stroke-width="2"/><path d="M323 262v34" stroke="#E0A800" stroke-width="1.5"/>',323,276)+
   khu('yingbi','<rect x="300" y="236" width="48" height="10" rx="2" fill="#B8AFA0" stroke="#7C8790" stroke-width="2"/>',300,226)+
   '<text x="320" y="173" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="13" fill="#fff" pointer-events="none">东</text><text x="79" y="200" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="13" fill="#fff" pointer-events="none">西</text></svg>'};
let KHAM=new Set(),PHA='kham';
function choiNha(){
  if(PHA==='kham'){
    $('#khung').innerHTML='<div class="tn-than"><div class="nha-wrap">'+NHA_SVG()+'<div><div class="thong-tin" id="tt"><h3>'+ic('kinh-lup')+'Khám phá ngôi nhà</h3><p>Chạm vào từng phần của bản vẽ: nhà chính, nhà hai bên, sân, cổng… để xem tên gọi và công dụng.</p></div><p class="dem-kham" id="demK"></p><div class="hang" style="justify-content:flex-start"><button class="btn m" type="button" id="sangHoi">'+ic('tick')+'Trả lời 5 câu hỏi</button></div></div></div></div>';
    const ve=()=>{$('#demK').textContent='Đã khám phá '+KHAM.size+'/6 khu'+(KHAM.size<6?' · khám phá hết sẽ dễ trả lời hơn':' · giỏi lắm!');document.querySelectorAll('.nha [data-k]').forEach(g=>g.classList.toggle('da',KHAM.has(g.dataset.k)))};ve();
    const mo=g=>{const k=g.dataset.k,K=D.khu[k];KHAM.add(k);document.querySelectorAll('.nha [data-k]').forEach(x=>x.classList.toggle('chon',x===g));am('choose');
      $('#tt').innerHTML='<h3><span class="zh">'+K.zh+'</span>'+K.vi+'</h3><span style="font-weight:700;color:var(--muted)">'+K.py+' <button class="spk" type="button" data-say="'+K.zh+'" aria-label="Nghe" style="display:inline-grid;vertical-align:middle;width:28px;height:28px">'+ic('loa')+'</button></span><p>'+K.mo+'</p>';ve()};
    $('.nha').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(g)mo(g)});
    $('.nha').addEventListener('keydown',e=>{const g=e.target.closest('[data-k]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();mo(g)}});
    $('#sangHoi').onclick=()=>{PHA='hoi';n=0;choiNha()};return}
  const q=D.cau[n];
  $('#khung').innerHTML=dauTn()+'<div class="tn-than"><div class="nha-wrap">'+NHA_SVG()+'<div><div class="thong-tin"><span class="loai" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--do);background:color-mix(in srgb,var(--do) 12%,transparent);border-radius:99px;padding:3px 11px">'+ic('chuot')+'Chạm vào bản vẽ</span><p style="font-size:18px;font-weight:700">'+q.q+'</p></div><div id="biet"></div></div></div></div>';
  document.querySelectorAll('.nha [data-k]').forEach(g=>g.classList.toggle('da',KHAM.has(g.dataset.k)));
  let xong=false;
  const tra=g=>{if(xong)return;xong=true;const ok=q.a.includes(g.dataset.k);g.classList.add(ok?'dung':'sai');
    if(!ok)document.querySelectorAll('.nha [data-k]').forEach(x=>{if(q.a.includes(x.dataset.k))x.classList.add('dung')});
    document.querySelectorAll('.nha [data-k]').forEach(x=>{if(q.a.includes(x.dataset.k))x.classList.add('da')});
    phanHoi(ok,q.x,q.k,n===TONG-1,choiNha)};
  $('.nha').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(g)tra(g)});
  $('.nha').addEventListener('keydown',e=>{const g=e.target.closest('[data-k]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tra(g)}});
}
// ---- 俗: ghép ảnh với biển tên ở hội chùa
function choiGhep(){
  const DO=D.do,ANH=xao(DO),TEN=xao(DO),XONG=[];let chon=null;
  const ve=()=>{
    $('#khung').innerHTML='<div class="tn-than ghep"><p class="ghep-goi">Chạm vào một ảnh, rồi chạm vào biển tên đúng của nó. Đã ghép <b>'+XONG.length+'/'+DO.length+'</b> · ghép sai '+sai+' lần</p>'+
      '<div class="ghep-anh" id="gA">'+ANH.map(d=>{const i=XONG.indexOf(d.id);return '<button type="button" data-id="'+d.id+'" class="'+(i>=0?'xong':d.id===chon?'chon':'')+'" style="--c:'+MAU[i>=0?i:0]+'" aria-label="Ảnh '+(i>=0?d.vi:'chưa ghép')+'"><img src="'+d.a[0]+'" alt=""><span class="so-cap">'+(i+1)+'</span></button>'}).join('')+'</div>'+
      '<div class="ghep-ten" id="gT">'+TEN.map(d=>{const i=XONG.indexOf(d.id);return '<button type="button" data-id="'+d.id+'" class="'+(i>=0?'xong':'')+'" style="--c:'+MAU[i>=0?i:0]+'"><span class="zh">'+d.zh+'</span><small>'+d.py+' · '+d.vi+'</small></button>'}).join('')+'</div>'+
      '<div class="ghep-tt">'+XONG.map((id,i)=>{const d=DO.find(x=>x.id===id);return '<p style="--c:'+MAU[i]+'"><b>'+d.zh+'</b>'+d.mo+'</p>'}).join('')+'</div>'+
      '<p style="font-size:11px;color:var(--muted);margin:0">Ảnh: '+DO.map(d=>esc(d.a[3])+' (<a href="'+d.a[1]+'" target="_blank" rel="noopener" style="color:inherit">'+d.a[2]+'</a>)').join(', ')+'.</p></div>';
    $('#gA').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('xong'))return;chon=b.dataset.id;am('choose');ve()};
    $('#gT').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('xong'))return;
      if(!chon){b.classList.add('sai');setTimeout(()=>b.classList.remove('sai'),400);return}
      if(b.dataset.id===chon){XONG.push(chon);const d=DO.find(x=>x.id===chon);tui.push([d.zh,d.py,d.vi]);chon=null;am('coin');ve();phao();if(XONG.length===DO.length)setTimeout(ket,900)}
      else{sai++;am('hurt');b.classList.add('sai');setTimeout(ve,400)}};
  };ve();
}
const CHOI={menu:choiMenu,chat:choiChat,nha:choiNha,ghep:choiGhep};
TONG=D.loai==='menu'?D.don.length:D.loai==='chat'?D.luot.length:D.loai==='nha'?D.cau.length:D.do.length;
function moDau(){
  $('#khung').innerHTML='<div class="qz-mo"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#E3F0F6"/><circle cx="60" cy="60" r="56" fill="none" stroke="#2F7FA0" stroke-width="3" stroke-dasharray="6 5"/><text x="60" y="78" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="54" fill="#2F7FA0">'+D.zh+'</text></svg>'+
    '<div><h3>'+esc(D.vi)+'</h3><p>'+esc(D.ten2)+'. Làm đúng để nhặt <b>tem từ mới</b> và nhận vé trải nghiệm.</p><button class="btn m" type="button" id="vao">'+ic('phat')+'Bắt đầu</button></div></div>';
  $('#vao').onclick=batDau;
}
function batDau(){n=0;dung=0;sai=0;kq=[];tui=[];PHA='kham';try{AM.unlock()}catch(e){}CHOI[D.loai]();$('#choi').scrollIntoView({behavior:'smooth',block:'start'})}
moDau();
$('#batDau').onclick=batDau;
document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s&&window.TTS)TTS.say(s.dataset.say)});
const bu=$('#buu');
bu.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=bu.getBoundingClientRect();bu.style.setProperty('--mx',((e.clientX-r.left)/r.width*2-1).toFixed(3));bu.style.setProperty('--my',((e.clientY-r.top)/r.height*2-1).toFixed(3));bu.classList.add('t3')});
bu.addEventListener('pointerleave',()=>{bu.classList.remove('t3');bu.style.removeProperty('--mx');bu.style.removeProperty('--my')});
const r=document.documentElement,tb=$('#themeBtn');
const cur=()=>r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const paint=()=>{tb.innerHTML=ic(cur()==='dark'?'mattroi':'trang')};
tb.addEventListener('click',()=>{r.dataset.theme=cur()==='dark'?'light':'dark';try{localStorage.setItem('cb-theme',r.dataset.theme)}catch(e){};paint()});
paint();
})();
</script>
</body>
</html>
