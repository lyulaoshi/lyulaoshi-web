<script>
(function(){
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=p=>p.toLowerCase().replace(/[\s'’\-·/]/g,'');
const MV={};(window.BAI||[]).forEach(b=>b.bai.forEach(l=>l.w.forEach(x=>{const k=x[0]+'|'+norm(x[1]||'');if(x[2]&&!MV[k])MV[k]=x[2]})));
const mean=(w,p)=>(NGHIA[w+'|'+p]||NGHIA[w]||MV[w+'|'+norm(p)]||'').split(/[;,]/)[0].trim();
let KN=new Set();try{const S=JSON.parse(localStorage.getItem('cb-tuvung-v2'))||{};KN=new Set(Object.entries(S.cards||{}).filter(([k,s])=>s.b>=4).map(([k])=>k))}catch(e){}
const known=w=>KN.has(w[0]+'|'+norm(w[1]));
const ALL=[];Object.keys(HSK).forEach(l=>HSK[l].forEach(([w,p])=>{if(w.length>1)ALL.push([w,p,mean(w,p),+l])}));
const wordsOf=z=>ALL.filter(w=>w[0].includes(z));
const RINGS=[{n:'HSK 1',f:l=>l===1,c:'#5DCAA5'},{n:'HSK 2–3',f:l=>l===2||l===3,c:'#85B7EB'},{n:'HSK 4',f:l=>l===4,c:'#AFA9EC'},{n:'HSK 5–6',f:l=>l>=5,c:'#F0997B'}];
const POP=['学','生','人','大','心','发','出','动','面','子','不','中','天','好','家','电','开','车'];
let ZI='学',LV=4,SEL=null,RSEL=-1,PAUSE=false,P=[],raf=0,t0=0,tAcc=0,last=0;
const mk=(t,a,p,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(p||$('svg')).appendChild(e);return e};
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const pyOf=z=>{for(const l of Object.keys(HSK)){const x=HSK[l].find(([v])=>v===z);if(x)return x[1]}return ''};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;

// ---- vẽ: bảng màu từng loại hành tinh (xanh ngọc = chữ gốc đứng đầu, cam đỏ = đứng sau, vàng = đã thuộc) ----
const PAL={H:[['#D9FBF1','#53C9A8','#0E5E52'],['#DDF1FF','#5BA9DE','#14456E'],['#E3FAE0','#6CC08A','#1C5B3A']],
           T:[['#FFE6DE','#EE7A5E','#6E1E12'],['#FFE3E6','#E25D6E','#5E1222'],['#FFE8E0','#D9604A','#5A1A0E']],
           G:[['#FFFBE6','#FFD54A','#B07A00']]};
const dark=()=>document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
let DAY=false,RINGF=1.85;   // RINGF: độ rộng vành đai so với bán kính hành tinh
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
function defs(){const d=mk('defs',{});DAY=!dark();
  const rg=(id,stops,o)=>{const g=mk('radialGradient',Object.assign({id,cx:.5,cy:.5,r:.5},o||{}),d);stops.forEach(([of,c,a])=>mk('stop',{offset:of,'stop-color':c,'stop-opacity':a==null?1:a},g))};
  rg('sunCore',[[0,'#FFFFF4'],[.35,'#FFF1B0'],[.7,'#FFC24A'],[1,'#F07A1A']]);
  rg('halo',[[0,'#FFE38A',0],[.62,'#FFE38A',0],[.75,'#FFD54A',.55],[1,'#FFD54A',0]]);
  rg('glare',[[0,'#FFFFFF',.9],[1,'#FFFFFF',0]]);rg('spec',[[0,'#FFFFFF',.32],[1,'#FFFFFF',0]]);
  rg('mw',DAY?[[0,'#B4A9F0',.35],[.5,'#C9C2FF',.15],[1,'#C9C2FF',0]]:[[0,'#C9C2FF',.22],[.5,'#8E7CF0',.08],[1,'#8E7CF0',0]]);
  rg('neb',DAY?[[0,'#7FD3C8',.28],[1,'#7FD3C8',0]]:[[0,'#3FB6C8',.16],[1,'#3FB6C8',0]]);
  rg('corona',DAY?[[0,'#FFD36B',.7],[.35,'#FFB84A',.3],[.7,'#FFB84A',.08],[1,'#FFB84A',0]]:[[0,'#FFD36B',.75],[.35,'#FFA43A',.28],[.7,'#FF7A1A',.08],[1,'#FF7A1A',0]]);
  Object.entries(PAL).forEach(([k,arr])=>arr.forEach(([a,b,c],i)=>rg('pl'+k+i,[[0,a],[.45,b],[1,c]],{fx:.36,fy:.36})));
  // bóng tối phía không có nắng: xoay theo hướng mặt trời
  const sh=mk('linearGradient',{id:'shade',x1:0,y1:.5,x2:1,y2:.5},d);
  [[0,0],[.42,0],[.62,DAY?.3:.42],[1,DAY?.62:.86]].forEach(([o,a])=>mk('stop',{offset:o,'stop-color':DAY?'#1A2050':'#05071A','stop-opacity':a},sh));
  // mặt trời sủi bọt (hạt sáng) + quầng mờ
  const f=mk('filter',{id:'gran',x:'-10%',y:'-10%',width:'120%',height:'120%'},d);
  const tb=mk('feTurbulence',{type:'fractalNoise',baseFrequency:'.055',numOctaves:3,seed:3,result:'n'},f);
  if(!reduced())mk('animate',{attributeName:'baseFrequency',values:'.05;.065;.05',dur:'14s',repeatCount:'indefinite'},tb);
  mk('feColorMatrix',{in:'n',type:'matrix',values:'0 0 0 0 .85  0 0 0 0 .35  0 0 0 0 .02  0 0 0 -1.6 1.05',result:'spots'},f);
  mk('feComposite',{in:'spots',in2:'SourceGraphic',operator:'in',result:'s2'},f);
  const fm=mk('feMerge',{},f);mk('feMergeNode',{in:'SourceGraphic'},fm);mk('feMergeNode',{in:'s2'},fm);
  const bl=mk('filter',{id:'blur',x:'-50%',y:'-50%',width:'200%',height:'200%'},d);mk('feGaussianBlur',{stdDeviation:14},bl);
  const bl2=mk('filter',{id:'blur2',x:'-50%',y:'-50%',width:'200%',height:'200%'},d);mk('feGaussianBlur',{stdDeviation:3},bl2);
  return d;
}
// một hành tinh (toạ độ gốc 0,0): thân có vân hoặc hố, bóng tối xoay theo mặt trời, có thể có vành đai
function planet(pg,w,kd,R,id){
  const h=hash(w[0]),pal=PAL[kd],pi=h%pal.length,type=kd==='G'?'gas':['gas','rock','gas','ice'][h%4],ring=w[0].length>=4||h%6===0;
  if(kd==='G'){mk('circle',{r:R*1.6,fill:'url(#halo)'},pg);mk('circle',{r:R+6,fill:'none',stroke:'#FFE38A','stroke-width':1.6,'stroke-dasharray':'1.5 5','stroke-linecap':'round',class:'spinr'},pg)}   // sao vàng: quầng + vòng lấp lánh
  const rt=mk('g',{transform:'rotate('+(-16+(h%9))+')'},pg);
  const RF=RINGF,rpath=(top)=>`M${-R*RF} 0A${R*RF} ${R*.42} 0 0 ${top?1:0} ${R*RF} 0`;
  if(ring){mk('path',{d:rpath(1),fill:'none',stroke:kd==='T'?'#E9C7A6':kd==='G'?'#F8E3A0':'#BFE3EA','stroke-width':R*.13,opacity:.42},rt);
    mk('path',{d:rpath(1),fill:'none',stroke:'#fff','stroke-width':1,opacity:.35},rt)}
  const cp=mk('clipPath',{id:'c'+id},pg);mk('circle',{r:R},cp);
  const body=mk('g',{'clip-path':'url(#c'+id+')'},pg);
  mk('circle',{r:R,fill:'url(#pl'+kd+pi+')'},body);
  if(type==='gas'){for(let i=-3;i<=3;i++)mk('ellipse',{cx:(h%7-3)*.6,cy:i*R*.27+((h>>3)%5-2),rx:R*1.2,ry:R*(.06+((h>>i+4)&3)*.025),fill:i%2?'#fff':'#000',opacity:i%2?.08:.06},body);
    if(h%3===0)mk('ellipse',{cx:R*.25,cy:R*.32,rx:R*.24,ry:R*.13,fill:'#000',opacity:.1},body)}
  else if(type==='rock'){for(let i=0;i<6;i++){const a=(h>>i)%628/100,r=R*(.25+((h>>(i+2))%55)/100),cr=R*(.07+((h>>(i+5))%10)/100);
    mk('circle',{cx:Math.cos(a)*r,cy:Math.sin(a)*r,r:cr,fill:'#000',opacity:.1},body);mk('circle',{cx:Math.cos(a)*r-cr*.25,cy:Math.sin(a)*r-cr*.25,r:cr*.75,fill:'#fff',opacity:.08},body)}}
  else{mk('ellipse',{cx:-R*.1,cy:-R*.35,rx:R*.7,ry:R*.18,fill:'#fff',opacity:.28},body);mk('ellipse',{cx:R*.2,cy:R*.25,rx:R*.6,ry:R*.12,fill:'#fff',opacity:.2},body)}
  const shade=mk('g',{},body);mk('rect',{x:-R,y:-R,width:2*R,height:2*R,fill:'url(#shade)'},shade);
  mk('ellipse',{cx:-R*.48,cy:0,rx:R*.3,ry:R*.44,fill:'url(#spec)'},shade);
  mk('circle',{r:R+.6,fill:'none',stroke:kd==='H'?'#BFF3FF':kd==='G'?'#FFF0B8':'#FFD9C2','stroke-width':1.2,opacity:.45},pg);
  if(ring)mk('path',{d:rpath(0),fill:'none',stroke:kd==='T'?'#E9C7A6':kd==='G'?'#F8E3A0':'#BFE3EA','stroke-width':R*.13,opacity:.58},rt.cloneNode(false)&&pg.appendChild(rt.cloneNode(false)));
  return shade;
}
function draw(){
  cancelAnimationFrame(raf);const svg=$('svg');svg.innerHTML='';defs();seed=7;
  const narrow=$('scene').clientWidth<640;$('scene').classList.toggle('narrow',narrow);$('scene').classList.toggle('day',DAY);
  const words=wordsOf(ZI).filter(w=>LV===6||w[3]<=LV);CURW=words;
  if(history.replaceState)history.replaceState(null,'','#'+encodeURIComponent(ZI)+(LV!==4?'/'+LV:''));   // link chia sẻ: tu-cung-chu.html#学 hoặc #学/6
