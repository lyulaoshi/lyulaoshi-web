:root{
  --paper:#F6F8FD; --surface:#FFFFFF; --surface2:#F3F5FB; --line:#E6E9F2; --line2:#EFF1F7;
  --ink:#30344C; --muted:#6F7490; --faint:#BFC4D6;
  /* pastel family */
  --coral:#E0525E; --coral-s:#FDECEE;
  --sky:#3B87D6;   --sky-s:#E7F1FC;
  --mint:#2A9A78;  --mint-s:#E2F5EE;
  --lav:#7A62C8;   --lav-s:#F0EBFC;
  --peach:#E07442; --peach-s:#FDEEE5;
  --butter:#C99312;--butter-s:#FDF5D9;
  --green:#2A9A60; --green-s:#E3F5EA;
  --c:var(--coral); --cs:var(--coral-s);
  --red:var(--coral); --red-soft:var(--coral-s); --indigo:var(--sky); --indigo-soft:var(--sky-s);
  --stroke-ink:#30344C; --stroke-hi:#E0525E; --stroke-ghost:#E8EBF3; --grid:#F2C4C9;
  --shadow:0 1px 2px rgba(48,52,76,.04),0 8px 24px rgba(48,52,76,.06);
  --hz:"KaiSub","Be Vietnam Pro","KaiTi","STKaiti","Kaiti SC","KaiTi_GB2312","楷体",serif;
  --vi:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
.c-coral{--c:var(--coral);--cs:var(--coral-s)} .c-sky{--c:var(--sky);--cs:var(--sky-s)} .c-mint{--c:var(--mint);--cs:var(--mint-s)}
.c-lav{--c:var(--lav);--cs:var(--lav-s)} .c-peach{--c:var(--peach);--cs:var(--peach-s)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--vi);font-size:18px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(900px 500px at -5% -10%,#FDECEE 0,transparent 60%),radial-gradient(800px 520px at 105% 20%,#E7F1FC 0,transparent 60%),radial-gradient(700px 500px at 30% 110%,#FDF5D9 0,transparent 60%),var(--paper);background-attachment:fixed}
.hz,.zh,.hzt{font-family:var(--hz)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .15s,background .15s,border-color .15s,color .15s}button:hover{transform:translateY(-1px)}}

/* ---------- top bar ---------- */
.bar{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 22px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand .seal{font-family:var(--hz);color:#fff;background:var(--coral);font-size:20px;padding:2px 14px;border-radius:999px;letter-spacing:.06em}
.brand .sec{color:var(--muted);font-size:14px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.mode button{border:none;background:none;padding:4px 14px;font-size:14px;color:var(--muted);border-radius:999px}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(48,52,76,.12);font-weight:600}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted)}
.tg:hover{border-color:var(--sky);color:var(--sky)}
.sprog{position:absolute;left:0;bottom:-1px;height:3px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,var(--coral),var(--peach),var(--butter));width:0;transition:width .15s}

/* ---------- deck ---------- */
#deck{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow:auto;padding:clamp(20px,3vw,44px) clamp(16px,2.2vw,36px) 40px;display:none}
.slide.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
.inner{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(16px,2.2vw,26px);position:relative}

/* ---------- scroll mode: each section a soft card ---------- */
html.scroll,html.scroll body{height:auto}
html.scroll body{overflow:visible;display:block;padding-bottom:40px}
html.scroll .bar{position:sticky;top:env(safe-area-inset-top,0px)}
html.scroll #deck{overflow:visible;padding:14px 10px 0}
html.scroll .slide{position:relative;inset:auto;display:block;overflow:visible;animation:none;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:var(--shadow);max-width:1560px;margin:0 auto 18px;padding-block:clamp(30px,4.4vw,56px)}
html.scroll .nav{display:none}
html.scroll .cover,html.scroll .sect{min-height:auto}
html.scroll .slide.sect-slide{background:var(--cs);border-color:transparent}
.slide{scroll-margin-top:72px}

/* heading label — pill */
.lab{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;flex-wrap:wrap;background:var(--cs);border-radius:999px;padding:5px 18px 5px 8px}
.lab .zh{background:var(--c);color:#fff;border-radius:999px;padding:1px 14px;font-size:clamp(20px,2.1vw,26px);letter-spacing:.08em}
.lab .vn{color:var(--c);font-weight:600;font-size:clamp(15px,1.5vw,18px)}
h2.t{margin:0;font-size:clamp(23px,2.6vw,33px);line-height:1.35;font-weight:600;text-wrap:balance}
h2.t .zh{font-weight:400}
.lead{color:var(--muted);margin:0;max-width:70ch}
.ctx{background:var(--cs);border-radius:18px;padding:12px 20px;color:var(--muted);font-size:16px}
.ctx .zh{color:var(--ink);font-size:21px}
.tip{font-size:15px;color:var(--muted);margin:0}

/* local toggles */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tt{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 16px;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--faint)}
.tt[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:var(--cs);font-weight:600}
.tt[aria-pressed="true"]::before{background:var(--c)}
.tt[data-t="hz"]{font-family:var(--hz);font-size:17px}
.no-py .dlg .py,.no-py .stage .py{display:none}
.no-vi .dlg .vi,.no-vi .stage .vi,.no-vi .ctx .vi{display:none}
.no-hz .dlg .hzt,.no-hz .stage .hzt,.no-hz .ctx .hzt{visibility:hidden}
.no-py td.py{visibility:hidden} .no-vi td.vcol{visibility:hidden} .no-hz td.hzt,.no-hz td .hzt{visibility:hidden}

.py{font-family:var(--vi);color:var(--sky);font-weight:400}
.vi{color:var(--muted);font-style:italic;font-weight:300}

/* cover */
.cover{min-height:100%;display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(20px,4vw,60px);align-items:center;max-width:1480px;margin:0 auto}
.cover .kicker{display:inline-block;color:var(--coral);background:var(--coral-s);border-radius:999px;padding:3px 14px;font-weight:600;font-size:14px}
.cover h1{font-family:var(--hz);font-size:clamp(120px,17vw,240px);line-height:1;margin:.2em 0 .05em;font-weight:500;letter-spacing:.04em}
.cover h1 .a,.cover h1 .b{font-family:"KuaiLe","KaiSub",var(--hz);font-weight:400;display:inline-block}
.cover h1 .a{color:var(--coral);transform:rotate(-6deg)} .cover h1 .b{color:var(--sky);transform:rotate(5deg) translateY(6px)}
.cover h1 small{display:block;font-family:var(--vi);font-size:clamp(20px,2.3vw,30px);font-weight:500;color:var(--muted);letter-spacing:0;margin-top:18px}
.cover .meta{display:grid;gap:4px;color:var(--muted);font-size:15px;margin-top:22px;padding-top:14px;border-top:2px dotted var(--line)}
.cover .meta b{color:var(--ink);font-weight:600}
.herowrap{position:relative;justify-self:center;width:min(380px,100%)}
.herowrap::before{content:"";position:absolute;inset:-8% -10% -12% -6%;background:radial-gradient(circle at 30% 30%,#FDF5D9 0,transparent 55%),radial-gradient(circle at 75% 70%,#E2F5EE 0,transparent 55%);border-radius:50%;z-index:0}
.tzg-hero{position:relative;z-index:1;aspect-ratio:1;width:100%;max-width:100%;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);cursor:pointer;display:block}

/* grids & boxes */
.grid{display:grid;gap:clamp(14px,1.8vw,22px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.box{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow)}
.box h3{margin:0 0 10px;font-size:18px;font-weight:600;color:var(--c)}
.box ul{margin:0;padding-left:1.1em}
.box li{margin:5px 0}
.box li::marker{color:var(--c)}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:14px;font-weight:500;background:var(--surface2);color:var(--muted)}
.pill.b{background:var(--cs);color:var(--c)} .pill.o{background:var(--butter-s);color:var(--butter)}

/* dialogue */
.dlg{display:flex;flex-direction:column;gap:6px}
.dl{display:grid;grid-template-columns:7.6em 1fr;gap:18px;align-items:start;padding:10px 16px;border-radius:18px}
.dl:nth-child(odd){background:rgba(231,241,252,.55)}
.dl .who{font-family:var(--hz);font-size:clamp(20px,2.1vw,25px);text-align:center;color:#fff;border-radius:14px;padding:4px 8px;line-height:1.3;margin-top:6px}
.dl .who .py{display:block;font-size:12px;color:rgba(255,255,255,.9)}
.who.p-libai{background:var(--peach)} .who.p-siqi{background:var(--sky)} .who.p-wang{background:var(--lav)}
.dl .say{display:flex;flex-direction:column;gap:2px}
.dl .say .hzt{font-size:clamp(30px,3.6vw,46px);line-height:1.35}
.dl .say .py{font-size:clamp(17px,1.7vw,21px)}
.dl .say .vi{font-size:clamp(16px,1.5vw,18px)}
.stage{font-size:15px;color:var(--muted);padding:4px 16px;text-align:center}
.stage .zh{font-size:19px}
.red{color:var(--coral)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:9px 16px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--cs);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--c);font-weight:600}
tr:last-child td{border-bottom:none}
td.hz{font-size:32px;white-space:nowrap}
td.hv{font-style:italic;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;color:var(--faint);font-size:15px}
.vtab{font-size:21px}
.vtab th{font-size:15px}
.vtab td{padding:11px 16px}
.vtab td.hz{font-size:42px}
.vtab td.py{font-size:23px}
.vtab td.n{font-size:18px}
.vtab td .sayb{width:36px;height:36px;font-size:16px}
@media (max-width:600px){.vtab{font-size:17px}.vtab td{padding:8px 8px}.vtab td.hz{font-size:30px}.vtab td.py{font-size:17px}.vtab td .sayb{width:28px;height:28px;font-size:13px;margin-left:4px}.vtab td.vcol{min-width:6.5em}}
.lv{display:inline-block;min-width:1.8em;text-align:center;background:var(--butter-s);color:var(--butter);border-radius:999px;font-size:13px;font-weight:700;padding:0 6px}
tr.go{cursor:pointer} tr.go:hover td{background:var(--cs)}

/* word card */
.wc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(18px,2.8vw,40px);align-items:start}
.wh{display:flex;flex-direction:column;gap:10px}
.wbox{background:var(--cs);border-radius:26px;padding:18px 22px}
.wh .w{font-family:var(--hz);font-size:clamp(76px,9vw,132px);font-weight:500;line-height:1.1;letter-spacing:.06em;white-space:nowrap}
.wh .w.len3{font-size:clamp(64px,7vw,112px);letter-spacing:.02em}
.wh .wpy{font-size:clamp(26px,2.8vw,36px);color:var(--c);font-weight:500}
.wh .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wh .mean{font-size:clamp(20px,2.1vw,25px);font-weight:600}
.wh .hvw{font-style:italic;color:var(--muted);font-size:16px}
.note{background:var(--butter-s);border-radius:16px;padding:12px 16px;font-size:17px}
.note b{color:var(--butter);font-weight:700}
.chain{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:16px 20px;align-items:baseline;box-shadow:var(--shadow)}
.chain .k{font-family:var(--hz);color:#fff;background:var(--c);border-radius:10px;padding:0 10px;font-size:18px;white-space:nowrap;text-align:center}
.chain .k small{font-family:var(--vi);display:block;font-size:11px;opacity:.9}
.chain .v{display:flex;flex-wrap:wrap;gap:10px 26px}
.it{display:inline-flex;flex-direction:column}
.it .hzt{font-size:30px;line-height:1.3}
.it .py{font-size:15px}
.it .vi{font-size:15px}

.chars{display:flex;flex-direction:column;gap:12px}
.ctabs{display:flex;gap:8px;flex-wrap:wrap}
.ctab{font-family:var(--hz);font-size:30px;line-height:1.1;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 18px;color:var(--muted);display:inline-flex;flex-direction:column;align-items:center}
.ctab small{font-family:var(--vi);font-size:12px;font-style:normal}
.ctab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chars .ctabs:has(.ctab:only-child){display:none}
.cp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 26px;background:var(--surface);border:1px solid var(--line2);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.cp[hidden]{display:none}
.anim{display:flex;flex-direction:column;gap:10px;align-items:center}
.anim svg.big{width:clamp(176px,20vw,256px);height:auto;aspect-ratio:1;display:block;cursor:pointer;border-radius:18px}
.anim .ctl{display:flex;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:15px;color:var(--muted)}
.btn.play{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.step{background:var(--cs);border-color:var(--c);color:var(--c);font-weight:600}
.btn:hover{border-color:var(--c);color:var(--c)} .btn.play:hover{color:#fff;filter:brightness(1.05)}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:18px;align-content:start;margin:0}
.info dt{color:var(--c);font-size:13px;font-weight:600;padding-top:5px;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.info dd{margin:0}
.info .rad{font-family:var(--hz);font-size:34px;color:var(--coral);vertical-align:-4px}
.czrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.czrow .cz{font-family:var(--hz);font-size:28px}
.czp{display:inline-flex;flex-direction:column;align-items:center;background:var(--cs);border-radius:14px;padding:4px 12px;line-height:1.25}
.czp b{font-weight:500;font-size:28px;color:var(--ink)}
.czp small{font-size:12px;color:var(--c);font-weight:500}
.plus{color:var(--faint);font-size:22px}
.strip{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;border-top:2px dotted var(--line);padding-top:14px}
.strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.strip svg{width:clamp(70px,6.7vw,89px);height:auto;aspect-ratio:1;display:block;background:var(--surface);border-radius:10px}
.strip figcaption{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip .lbl{width:100%;font-size:13px;color:var(--c);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.tile svg.big{width:136px;height:136px;cursor:pointer}
.tile .cz{font-family:var(--hz);font-size:24px}
.tile small{color:var(--muted);font-size:14px}
.tcz{justify-content:center}.tcz .cz{font-size:22px}.tcz .czp b{font-size:22px}

/* grammar */
.formula{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:clamp(19px,2vw,24px);font-weight:500}
.chip{padding:8px 18px;border-radius:16px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;font-family:var(--hz);font-size:clamp(22px,2.3vw,28px)}
.chip small{font-family:var(--vi);font-size:12px;font-weight:500;opacity:.85}
.S{background:var(--sky-s);color:var(--sky)} .V{background:var(--coral-s);color:var(--coral)} .O{background:var(--butter-s);color:var(--butter)}
.ex{display:flex;flex-direction:column;gap:10px}
.exl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.exl .zh{font-size:clamp(28px,3vw,38px)}
.seg{padding:0 6px;border-radius:8px}
mark{background:var(--butter-s);color:var(--ink);padding:0 6px;border-radius:8px}
mark.r{background:var(--coral-s);color:var(--coral)}
.arrow{color:var(--faint);font-size:24px}
.rule{background:var(--cs);padding:14px 20px;border-radius:18px;font-size:18px}
.rule b{color:var(--c);font-weight:700}
.err{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:18px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:14px 20px;box-shadow:var(--shadow)}
.err .x{color:#fff;background:var(--coral);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:4px}
.err .ok{color:#fff;background:var(--green);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:4px}
.err .zh{font-size:26px}
.err .why{grid-column:2;color:var(--muted);font-size:15px;margin-bottom:8px}

/* exercises */
.q{display:flex;flex-direction:column;gap:16px}
.qi{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;font-size:clamp(20px,2.1vw,26px)}
.qi .no{color:var(--c);font-weight:700;font-size:16px;min-width:2.2em;font-variant-numeric:tabular-nums}
.qi .zh{font-size:clamp(26px,2.8vw,36px)}
.qi .zh:has(input.fill){flex:1 1 auto;min-width:0}
.qi .hint{font-size:15px;color:var(--muted)}
.blank{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:nowrap;font-family:var(--hz);line-height:1.25;vertical-align:baseline}
input.fill{flex:none;font:inherit;font-family:var(--hz);color:var(--ink);background:var(--cs);border:none;border-bottom:2px dashed var(--c);border-radius:10px 10px 0 0;padding:0 8px;text-align:center;max-width:100%;min-width:2.4em}
input.fill:focus{outline:none;background:#fff;border-bottom-style:solid;box-shadow:0 0 0 2px var(--cs)}
input.fill.f-ok{background:var(--green-s);border-bottom:2px solid var(--green);color:var(--green)}
input.fill.f-no{background:var(--coral-s);border-bottom:2px solid var(--coral);color:var(--coral)}
.ans{display:none;color:var(--coral);font-family:var(--hz);font-size:.82em}
.show-ans .ans{display:inline}
.show-ans .ans::before{content:"→ ";color:var(--faint)}
.ansblk{display:none;background:var(--green-s);border-radius:16px;padding:12px 18px;font-size:17px}
.ansblk b{color:var(--green);font-weight:700}
.show-ans .ansblk{display:block}
.ansrow{display:flex;justify-content:flex-end}
.blank.plain{min-width:2.6em;justify-content:center;border-bottom:2px dashed var(--faint);padding:0 6px}
.show-ans .blank.plain .ans{font-size:1em}
.show-ans .blank.plain .ans::before{content:none}
.ansbtn{border:none;background:var(--green-s);color:var(--green);border-radius:999px;padding:6px 18px;font-size:15px;font-weight:600}
.ansbtn[aria-pressed="true"]{background:var(--green);color:#fff}
.opts{display:inline-flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 16px;font-size:clamp(20px,2.1vw,26px)}
.opt .zh{font-size:inherit}
.opt:hover{border-color:var(--c)}
.opt.right,.show-ans .opt[data-ok]{background:var(--green-s);border-color:#9FD8B8;color:var(--green)}
.opt.wrong{background:var(--coral-s);border-color:#F3BCC1;color:var(--coral)}
.pos{display:inline-flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.pos .slot{border:1.5px dashed var(--faint);border-radius:10px;padding:0 9px;font-family:var(--vi);font-size:15px;color:var(--muted);background:var(--surface)}
.pos .slot.right,.show-ans .pos .slot[data-ok]{background:var(--green-s);color:var(--green);border-color:#9FD8B8;border-style:solid}
.pos .slot.wrong{background:var(--coral-s);color:var(--coral);border-color:#F3BCC1}
.say-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.say-list button{background:var(--surface);border:1px solid var(--line2);border-radius:18px;text-align:left;padding:10px 18px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.say-list button .zh{font-size:clamp(26px,2.8vw,36px)}
.say-list button .py{font-size:17px}
.sub{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.subtab{border-collapse:separate;border-spacing:0 4px;width:auto}
.subtab td{font-family:var(--hz);font-size:26px;padding:4px 16px;border:none;background:var(--surface2)}
.subtab td:first-child{border-radius:12px 0 0 12px} .subtab td:last-child{border-radius:0 12px 12px 0}
.subtab tr{cursor:pointer}
.subtab tr:hover td,.subtab tr.sel td{background:var(--cs);color:var(--c)}
.model p{margin:.2em 0}
.model .zh{font-size:clamp(26px,2.8vw,36px)}
.u{border-bottom:3px solid var(--c);color:var(--c)}
.person{display:flex;gap:16px;align-items:center}
.av{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--hz);font-size:32px;flex:none;color:#fff}
.av.a{background:var(--peach)} .av.b{background:var(--sky)}
.itab input{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 10px;font-family:var(--hz);font-size:20px}
.core{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.core .c{background:var(--surface);border-radius:20px;padding:12px 18px;display:flex;flex-direction:column;box-shadow:var(--shadow);border:2px dashed #F3BCC1}
.core .c .hzt{font-size:clamp(26px,2.7vw,34px)}
.bubbles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 0}
.bub{padding:8px 18px;border-radius:22px 22px 22px 6px;font-weight:600;font-size:clamp(18px,2vw,26px)}
.bub:nth-child(5n+1){background:var(--sky-s);color:var(--sky)} .bub:nth-child(5n+2){background:var(--butter-s);color:var(--butter)}
.bub:nth-child(5n+3){background:var(--mint-s);color:var(--mint)} .bub:nth-child(5n+4){background:var(--lav-s);color:var(--lav)} .bub:nth-child(5n){background:var(--peach-s);color:var(--peach)}
.bub:nth-child(3n){transform:rotate(-3deg)} .bub:nth-child(3n+1){transform:rotate(2deg)} .bub:nth-child(4n+2){transform:translateY(6px)}
.bubbles{gap:14px 12px;padding:14px 0 18px;max-width:1100px;margin:0 auto}
.bub.zhb{font-family:var(--hz);background:var(--coral)!important;color:#fff!important;font-size:clamp(24px,2.6vw,34px);font-weight:500}
.sect{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:1480px;margin:0 auto;gap:12px;position:relative}
.sect .big{font-family:var(--hz);font-size:clamp(64px,10vw,130px);font-weight:500;line-height:1.05;color:var(--c);letter-spacing:.06em}
.sect .vn{font-size:clamp(22px,2.6vw,32px);font-weight:600}
.sect .lst{color:var(--muted);font-size:17px;max-width:70ch}
.sect .dots{display:flex;gap:10px}
.sect .dots i{width:14px;height:14px;border-radius:50%;background:var(--c);opacity:.25}
.sect .dots i:nth-child(2){opacity:.5}.sect .dots i:nth-child(3){opacity:.8}

/* bottom nav */
.nav{display:flex;align-items:center;gap:12px;padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.9);border-top:1px solid var(--line)}
.nav .nb{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 18px;color:var(--muted);font-weight:600}
.nav .nb:hover{color:var(--coral);border-color:var(--coral)}
.prog{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--peach),var(--butter));width:0;transition:width .25s;border-radius:99px}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:4.5em;text-align:center}

.sayb{border:none;background:var(--cs);color:var(--c);border-radius:50%;width:38px;height:38px;font-size:17px;display:inline-grid;place-items:center;vertical-align:middle;margin-left:10px;padding:0}
td .sayb{width:30px;height:30px;font-size:14px;margin-left:8px;background:var(--mint-s);color:var(--mint)}
.sayb:hover{filter:brightness(.96)}
.sayb.playing{background:var(--c);color:#fff;animation:pulse 1s ease infinite}
td .sayb.playing{background:var(--mint);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--cs)}}
.wh .wpy{display:flex;align-items:center}
.row .sayb{width:32px;height:32px;font-size:14px;margin-left:4px}
.wbox .sayb{background:#fff;width:44px;height:44px;font-size:19px;box-shadow:0 2px 8px rgba(48,52,76,.1)}
/* audio player */
.aplayer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-size:15px}
.aplayer .atrk{font-weight:600;color:var(--c);white-space:nowrap}
.ab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ab:hover{border-color:var(--c);color:var(--c)}
.ab.pp{background:var(--c);border-color:var(--c);color:#fff;width:44px;height:44px;padding:0;font-size:16px;display:grid;place-items:center}
.at{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:2.6em;text-align:center}
.aseek{flex:1 1 180px;min-width:120px;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--c) var(--p,0%),var(--cs) var(--p,0%));cursor:pointer}
.aseek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.aseek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.aplayer .sp{display:inline-flex;gap:4px;background:var(--surface2);border-radius:999px;padding:3px}
.ar{border:none;background:none;border-radius:999px;padding:2px 9px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ar.on{background:var(--c);color:#fff;font-weight:600}
@media (max-width:820px){.aplayer{border-radius:20px}}
/* cover orbit */
.orbit{position:relative;justify-self:center;width:min(700px,100%);aspect-ratio:1;container-type:inline-size}

 ${(()=>{const G2=["6:30 起床","7:00 早饭","7:30 上班","8:00 上课","11:30 下课","12:00 午饭","17:30 下班","18:00 回家","晚饭","电视","汉语","22:30 睡觉","早上","中午","晚上","星期一","星期天"];

 const W=(t,f)=>{let w=0;for(const ch of t)w+=/[぀-鿿가-힯]/.test(ch)?1.05:0.64;return (w+1.8)*f;};
 const placed=[{x:50,y:50,w:46,h:17}];const out=[];
 const items=G2.map(t=>{const fs=2.9+rnd()*0.7;return {t,fs,w:W(t,fs),h:fs*2.3};}).sort((p,q)=>q.w-p.w);
 items.forEach(({t,fs,w,h})=>{let best=null,bs=-1;
  for(let k=0;k<4000;k++){const x=1+rnd()*98,y=1+rnd()*98;

const NS="http://www.w3.org/2000/svg";
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let UID=0;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function grid(svg,light){
  el("rect",{x:8,y:8,width:1008,height:1008,fill:"none",stroke:"var(--grid)","stroke-width":light?10:14},svg);
  const g={stroke:"var(--grid)","stroke-width":light?6:8,"stroke-dasharray":light?"20 20":"28 22"};
  el("line",Object.assign({x1:512,y1:8,x2:512,y2:1016},g),svg);
  el("line",Object.assign({x1:8,y1:512,x2:1016,y2:512},g),svg);
}
function medLen(m){let s=0;for(let i=1;i<m.length;i++)s+=Math.hypot(m[i][0]-m[i-1][0],m[i][1]-m[i-1][1]);return s;}
function bigSVG(ch){
  const d=STROKES[ch], id="c"+(UID++);
  const svg=el("svg",{viewBox:"0 0 1024 1024",class:"big",role:"img","aria-label":"Bút thuận chữ "+ch});
  grid(svg);
  const defs=el("defs",{},svg);
  const g=el("g",{transform:"translate(0,900) scale(1,-1)"},svg);
  d.s.forEach(p=>el("path",{d:p,fill:"var(--stroke-ghost)"},g));
  const anim=[];
  d.s.forEach((p,i)=>{
    const cp=el("clipPath",{id:id+"-"+i},defs); el("path",{d:p,transform:"translate(0,900) scale(1,-1)"},cp);
  });
  const g2=el("g",{},svg);
  d.m.forEach((m,i)=>{
    const len=medLen(m)+60;
    const pts=m.map(q=>q[0]+" "+(900-q[1]));
    const pa=el("path",{d:"M "+pts.join(" L "),fill:"none",stroke:"var(--stroke-ink)","stroke-width":200,"stroke-linecap":"round","stroke-linejoin":"round","clip-path":`url(#${id}-${i})`},g2);
    pa.style.strokeDasharray=len+" "+(len+400);pa.style.strokeDashoffset=0;
    anim.push({pa,len});
  });
  svg._a={anim,tok:0,k:-1};
  return svg;
}
function resetStrokes(svg,visible){
  const A=svg._a;A.tok++;
  A.anim.forEach(o=>{o.pa.style.transition="none";o.pa.style.strokeDashoffset=visible?0:o.len;o.pa.style.opacity=visible?1:0;o.pa.style.stroke="var(--stroke-ink)";});
  svg.getBoundingClientRect();
}
function drawStroke(o,done,tok,A){
  const dur=Math.max(280,o.len*0.85);
  o.pa.style.stroke="var(--stroke-hi)";o.pa.style.opacity=1;
  o.pa.style.transition="none";o.pa.style.strokeDashoffset=o.len;o.pa.getBoundingClientRect();
  o.pa.style.transition=`stroke-dashoffset ${dur}ms linear`;o.pa.style.strokeDashoffset=0;
  setTimeout(()=>{if(tok!==A.tok)return;o.pa.style.stroke="var(--stroke-ink)";done&&done();},dur+140);
}
// looping animation while the character is on screen
const visIO=new IntersectionObserver(es=>es.forEach(en=>{const s=en.target;s._vis=en.isIntersecting;
  if(en.isIntersecting){if(!s._a.step)playChar(s);}else{s._a.tok++;}}),{threshold:0.25});
function watch(svg){svg.setAttribute("title","Bấm để viết lại tự động");svg.addEventListener("click",()=>{svg._a.step=false;playChar(svg);});visIO.observe(svg);}
function playChar(svg){
  const A=svg._a;resetStrokes(svg,RM);A.k=-1;
  if(RM)return;
  const tok=A.tok;let i=0;
  const next=()=>{if(tok!==A.tok)return;
    if(i>=A.anim.length){setTimeout(()=>{if(tok===A.tok&&svg._vis&&!A.step)playChar(svg);},1600);return;}
    drawStroke(A.anim[i++],next,tok,A);};
  setTimeout(next,250);
}
function stepChar(svg){
  const A=svg._a;
  if(!A.step){A.step=true;A.k=-1;}
  if(A.k<0||A.k>=A.anim.length-1){resetStrokes(svg,false);A.k=-1;}
  A.k++;const tok=A.tok;
  if(RM){A.anim[A.k].pa.style.opacity=1;A.anim[A.k].pa.style.strokeDashoffset=0;return;}
  drawStroke(A.anim[A.k],null,tok,A);
}
function strip(ch,host){
  const d=STROKES[ch];
  host.innerHTML=`<div class="lbl">Bút thuận · ${d.s.length} nét</div>`;
  d.s.forEach((_,k)=>{
    const f=document.createElement("figure");
    const svg=el("svg",{viewBox:"0 0 1024 1024","aria-hidden":"true"});grid(svg,true);
    const g=el("g",{transform:"translate(0,900) scale(1,-1)"},svg);
    d.s.forEach((p,j)=>el("path",{d:p,fill:j<k?"var(--stroke-ink)":j===k?"var(--stroke-hi)":"var(--stroke-ghost)"},g));
    f.appendChild(svg);const c=document.createElement("figcaption");c.textContent=k+1;f.appendChild(c);host.appendChild(f);
  });
}
function mountPanel(cp){
  if(cp._m)return cp._m;const ch=cp.dataset.ch;
  const svg=bigSVG(ch);cp.querySelector(".slot-svg").appendChild(svg);
  const st=cp.querySelector(".strip");if(st)strip(ch,st);

  sb&&sb.addEventListener("click",()=>stepChar(svg));
  cp._m=svg;return svg;
}

document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("prog").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*slides.length));};

// scroll-mode observer: mark current section & play strokes once when it comes into view
const io=new IntersectionObserver(ents=>{
  if(!SCROLL)return;
  ents.forEach(en=>{
    const s=en.target;
    if(en.isIntersecting){
      if(!s._played){s._played=true;activate(s);}
    }
  });
},{rootMargin:"0px 0px -35% 0px",threshold:0.05});
slides.forEach(s=>io.observe(s));
function onScroll(){
  if(!SCROLL)return;
  const y=window.scrollY+window.innerHeight*0.3;let k=0;
  for(let i=0;i<slides.length;i++){if(slides[i].offsetTop<=y)k=i;else break;}
  if(k!==cur)setCur(k);
  const h=document.documentElement.scrollHeight-window.innerHeight;
  sprog.style.width=(h>0?window.scrollY/h*100:0)+"%";
}
window.addEventListener("scroll",onScroll,{passive:true});

// modes
const mScroll=document.getElementById("mScroll"),mSlide=document.getElementById("mSlide");
function setMode(scroll,keep){
  const at=cur;SCROLL=scroll;
  root.classList.toggle("scroll",scroll);
  mScroll.setAttribute("aria-pressed",scroll);mSlide.setAttribute("aria-pressed",!scroll);
  slides.forEach(s=>s.classList.remove("on"));
  sprog.style.width="0";
  try{localStorage.setItem("b1-mode",scroll?"scroll":"slide");}catch(e){}
  if(scroll){requestAnimationFrame(()=>{go(at,false);onScroll();});}
  else{slides[at].classList.add("on");setCur(at);activate(slides[at]);}
}
mScroll.onclick=()=>{setMode(true);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});};
mSlide.onclick=()=>{setMode(false);goFull(true);};
// zoom for presentation
let userZ=1;try{userZ=+localStorage.getItem("b1-zoom")||1;}catch(e){}
const zVal=document.getElementById("zVal"),fsBtn=document.getElementById("fsBtn");
function applyZ(){const auto=Math.min(1.6,Math.max(innerWidth<820?1:1.05,Math.min(innerWidth/1250,innerHeight/760)));root.style.setProperty("--z",(auto*userZ).toFixed(3));root.style.setProperty("--zs",userZ.toFixed(2));zVal.textContent=Math.round(userZ*100)+"%";try{localStorage.setItem("b1-zoom",userZ);}catch(e){}}
document.getElementById("zIn").onclick=()=>{userZ=Math.min(1.8,+(userZ+0.1).toFixed(2));applyZ();};
document.getElementById("zOut").onclick=()=>{userZ=Math.max(0.6,+(userZ-0.1).toFixed(2));applyZ();};
addEventListener("resize",applyZ);applyZ();
function goFull(on){try{if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}}
fsBtn.onclick=()=>goFull(!document.fullscreenElement);
document.addEventListener("fullscreenchange",()=>{fsBtn.setAttribute("aria-pressed",!!document.fullscreenElement);applyZ();});


// TOC: parent folders + children, no numbering
const toc=document.getElementById("toc"),pan=document.getElementById("tocPan");
const groupsT=[];SL.forEach((s,i)=>{let G=groupsT[groupsT.length-1];if(!G||G.sec!==s.sec){G={sec:s.sec,items:[]};groupsT.push(G);}G.items.push(i);});
pan.innerHTML=`<div class="ph"><b>Mục lục</b><button class="x" id="tocX" aria-label="Đóng">✕</button></div>`+groupsT.map(G=>{
  const cls=slides[G.items[0]].className.match(/c-\w+/)[0];
  const words=G.sec.includes("生词");
  const plain=G.items.filter(i=>!(words&&SL[i].id&&SL[i].id.startsWith("w-"))&&!slides[i].classList.contains("sect-slide"));
  const wi=G.items.filter(i=>words&&SL[i].id&&SL[i].id.startsWith("w-"));
  const sp=G.sec.split(" ");const secH=`<b class="zh">${sp[0]}</b> ${sp.slice(1).join(" ")}`;return `<details class="${cls}" open><summary>${secH}</summary><div class="kids">${plain.map(i=>`<button class="ti" data-i="${i}">${SL[i].title}</button>`).join("")}</div>${wi.length?`<div class="kids chips">${wi.map(i=>`<button class="ti" data-i="${i}">${SL[i].title}</button>`).join("")}</div>`:""}</details>`;}).join("");
document.getElementById("tocX").onclick=()=>{toc.hidden=true;};
pan.querySelectorAll(".ti").forEach(b=>b.onclick=()=>{toc.hidden=true;go(+b.dataset.i);});
document.getElementById("tToc").onclick=()=>{toc.hidden=!toc.hidden;};
toc.addEventListener("click",e=>{if(e.target===toc)toc.hidden=true;});

document.addEventListener("keydown",e=>{
  if((e.target.tagName==="INPUT"||e.target.tagName==="SELECT"))return;
  const k=e.key;
  if(!SCROLL){
    if(k==="ArrowRight"||k==="PageDown"||k===" "){e.preventDefault();go(cur+1);return;}
    if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1);return;}
    if(k==="Home"){go(0);return;} if(k==="End"){go(slides.length-1);return;}
  }
  if((k==="+"||k==="=")){document.getElementById("zIn").click();return;}
  if((k==="-"||k==="_")){document.getElementById("zOut").click();return;}
  if((k==="f"||k==="F")){fsBtn.click();return;}
  if(k==="m"||k==="M")document.getElementById("tToc").click();
  else if(k==="Escape")toc.hidden=true;
});
let sx=null;deck.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
deck.addEventListener("touchend",e=>{if(SCROLL||sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));sx=null;});

let pref="scroll";try{pref=localStorage.getItem("b1-mode")||"scroll";}catch(e){}
const hm=(location.hash||"").match(/^#s(\d+)$/);
cur=hm?Math.max(0,Math.min(slides.length-1,+hm[1]-1)):0;
setMode(pref!=="slide");

</script>
</body>
</html>
