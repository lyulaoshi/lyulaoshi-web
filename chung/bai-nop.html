<script>
(function(){
// Thu mã nộp bài của trò chơi giao về nhà. window.THUBAI cho phép gắn thêm loại mã khác.
const $=id=>document.getElementById(id), KHO_TRO='nv-nop-tro';
const el=(t,c,s)=>{const e=document.createElement(t);if(c)e.className=c;if(s!==undefined)e.textContent=s;return e};   // chữ học viên gõ chỉ đưa vào bằng textContent
const lay=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}};
let TRO=lay(KHO_TRO);
const PHAN=[];
const G=(window.GIAOBAI&&GIAOBAI.GAME)||{};
const luu=()=>{PHAN.forEach(p=>p.luu());try{localStorage.setItem(KHO_TRO,JSON.stringify(TRO))}catch(e){}};
const so=v=>Number.isFinite(+v)?Math.max(0,Math.round(+v)):0;
const khoaTen=t=>String(t).trim().replace(/\s+/g,' ').toLowerCase();

/* ---------- trò chơi ---------- */
// nhóm theo bài giao, bài vừa đọc mã gần nhất đứng trên
function nhomTro(){const g=new Map();TRO.forEach(r=>{if(!g.has(r.aid))g.set(r.aid,[]);g.get(r.aid).push(r)});
  return [...g.values()].sort((a,b)=>Math.max(...b.map(r=>r.luc||0))-Math.max(...a.map(r=>r.luc||0)))}
// mỗi em lấy lượt tốt nhất theo luật của trò (có trò kết quả càng nhỏ càng tốt)
function xepHang(rs){const g=G[(rs.find(r=>r.g)||{}).g];
  const hon=(a,b)=>g&&g.xTruoc&&a.x!==b.x?a.x>b.x:(a.v!==b.v?(g&&g.thap?a.v<b.v:a.v>b.v):(a.giay||1e9)<(b.giay||1e9));
  const tot=new Map();rs.forEach(x=>{const k=khoaTen(x.ten),c=tot.get(k);if(!c)tot.set(k,{...x,max:x.luot});else{const m=Math.max(c.max,x.luot);tot.set(k,hon(x,c)?{...x,max:m}:{...c,max:m})}});
  return {g,ten:(rs.find(r=>r.bai)||{}).bai||'Bài trò chơi',hang:[...tot.values()].sort((a,b)=>hon(a,b)?-1:hon(b,a)?1:0),kq:x=>g?g.kq(x.v,x.x):x.v+' / '+x.x}}
const giayChu=s=>s?GIAOBAI.phut(so(s)):'';

/* ---------- vẽ ---------- */
function hop(loai,tieuDe,phu,cot,xoaBai){
  const box=el('section','bai'),dau=el('div','dau-bai'),trai=el('div'),h=el('h2');trai.appendChild(el('span','loai',loai));
  if(typeof tieuDe==='string')h.textContent=tieuDe;else h.appendChild(tieuDe);trai.appendChild(h);trai.appendChild(el('p','phu',phu));
  const b=el('button','bo-bai','Xoá bài');b.type='button';b.addEventListener('click',()=>{if(!b.dataset.chac){b.dataset.chac=1;b.textContent='Bấm lần nữa để xoá';setTimeout(()=>{delete b.dataset.chac;b.textContent='Xoá bài'},3000);return}xoaBai();luu();ve();$('bao').textContent='Đã xoá một bài khỏi danh sách.'});
  dau.appendChild(trai);dau.appendChild(b);box.appendChild(dau);
  const cuon=el('div','cuon'),tb=el('table'),hd=el('tr','dau');cot.forEach(x=>hd.appendChild(el('th',null,x)));tb.appendChild(hd);cuon.appendChild(tb);box.appendChild(cuon);$('ra').appendChild(box);return tb}
const o=(tr,nhan,chu,c)=>{const td=el('td',c||'so',chu);if(nhan)td.dataset.l=nhan;tr.appendChild(td);return td};
function ve(){
  $('ra').textContent='';
  let n=0;PHAN.forEach(p=>n+=p.ve());
  const tr_=nhomTro();
  if(!n&&!tr_.length){$('ra').appendChild(el('div','trong','Chưa có bài nộp nào.'));return}
  tr_.forEach(rs=>{const x=xepHang(rs),aid=rs[0].aid;
    const tb=hop('Trò chơi',x.ten,[x.g?x.g.t+' '+x.g.z:'',x.hang.length+' học viên đã nộp'].filter(Boolean).join(' · '),
      ['Hạng','Họ tên','Kết quả','Thời gian','Số lượt'],()=>{TRO=TRO.filter(r=>r.aid!==aid)});
    x.hang.forEach((r,i)=>{const tr=el('tr');o(tr,'Hạng',String(i+1));const ten=el('td');ten.appendChild(el('b',null,String(r.ten)));tr.appendChild(ten);
      o(tr,'Kết quả',x.kq(r));o(tr,'Thời gian',giayChu(r.giay)||'—');o(tr,'Số lượt',String(so(r.max)));tb.appendChild(tr)})});
}

$('doc').addEventListener('click',()=>{
  const t=$('dan').value.replace(/​/g,'');
  let moi=0,thay=0,hong=0;
  PHAN.forEach(p=>{const r=p.nhan(t);moi+=r.moi;thay+=r.thay;hong+=r.hong});
  if(window.GIAOBAI){const r=GIAOBAI.doc(t),n=(t.match(/LL1\./g)||[]).length;thay+=n;hong+=n-r.ds.length;const luc=Date.now();
    r.ds.forEach(m=>{const cu=TRO.find(x=>x.aid===m.aid&&x.ten===m.ten&&x.v===m.v&&x.x===m.x&&x.giay===m.giay&&x.luot===m.luot);
      if(cu)cu.luc=luc;else{TRO.push({...m,luc});moi++}})}
  luu();ve();
  $('bao').textContent=!thay?'Không thấy mã nộp bài nào trong đoạn vừa dán.':`Đọc được ${moi} bài mới.${hong>0?` Có ${hong} mã hỏng (chép thiếu hoặc bị sửa), nhờ học viên gửi lại.`:''}`;
  if(moi&&hong<=0)$('dan').value='';
});
$('chep').addEventListener('click',e=>{
  const tr_=nhomTro(),them=PHAN.map(p=>p.dong()).filter(d=>d.length);
  if(!them.length&&!tr_.length){$('bao').textContent='Chưa có gì để chép.';return}
  const sach=v=>{v=String(v==null?'':v).replace(/[\t\r\n]+/g,' ');return /^[=+\-@]/.test(v)?"'"+v:v};   // chặn ô bị Excel hiểu là công thức
  const dong=[];them.forEach(d=>{if(dong.length)dong.push([]);dong.push(...d)});
  if(tr_.length){if(dong.length)dong.push([]);dong.push(['Trò chơi','Trò','Hạng','Họ tên','Kết quả','Thời gian','Số lượt']);
    tr_.forEach(rs=>{const x=xepHang(rs);x.hang.forEach((r,i)=>dong.push([x.ten,x.g?x.g.t:'',i+1,r.ten,x.kq(r),giayChu(r.giay),so(r.max)]))})}
  NV.chep(dong.map(d=>d.map(sach).join('\t')).join('\n'),e.currentTarget);
});
$('xoa').addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.chac){b.dataset.chac=1;b.textContent='Bấm lần nữa để xoá hết';setTimeout(()=>{delete b.dataset.chac;b.textContent='Xoá danh sách'},3000);return}
  PHAN.forEach(p=>p.xoa());TRO=[];luu();ve();delete b.dataset.chac;b.textContent='Xoá danh sách';$('bao').textContent='Đã xoá.'});
window.THUBAI={el,hop,o,so,khoaTen,them(p){PHAN.push(p);ve()}};
ve();
NV.loiRieng($('chan'));
})();
</script>
