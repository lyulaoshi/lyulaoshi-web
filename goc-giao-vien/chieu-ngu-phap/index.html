<script>
(function(){
const {$,IC,esc,store}=GV,{toan}=GVT;
const o=Object.assign({p:false,v:false,z:1},store.get('gv-chieu-np')||{});
const luu=()=>store.set('gv-chieu-np',o);
let da=[],trang=[],i=0,hien=0,dang=false;
GVNP.chon($('chon'),l=>{da=l;$('bChieu').disabled=!l.length;$('ghi').textContent=l.length?'':'Chọn ít nhất một điểm ngữ pháp.'});
const cap=x=>x.lv==='khac'||x.lv==='soan'?'Ngữ pháp':'HSK '+x.lv;
/* mỗi điểm: 1 trang bìa + 1 trang cho mỗi công thức */
function dung_(bai){const t=[];bai.forEach(b=>{const L=b.L,R=L.rules||[];
  t.push({loai:'dau',b});R.forEach((r,k)=>t.push({loai:'mau',b,r,k,tong:R.length}))});return t}
function ve(){const s=trang[i],el=$('trang');TTS.stop();
  el.className='trang-np'+(s.loai==='dau'?' dau':'');
  if(s.loai==='dau')el.innerHTML='<span class="tn-cap">'+cap(s.b)+'</span><div class="tn-zh'+([...s.b.L.title].length>12?' dai':'')+'" lang="zh">'+esc(s.b.L.title)+'</div><div class="tn-vi">'+esc(s.b.L.vi)+'</div>';
  else{const r=s.r,ex=r.ex||[],mau=r.mau||ex.some(e=>/\{\d\|/.test(e[0]));
    el.innerHTML='<div class="tn-t">'+(s.tong>1?(s.k+1)+'. ':'')+esc(r.t)+(r.sub?'<small lang="zh">'+esc(r.sub)+'</small>':'')+'</div>'+GVNP.fx(r.fx,mau,r.ch)
      +(r.mean?'<div class="tn-y">'+r.mean+'</div>':'')
      +'<ul class="tn-ex">'+ex.map((e,k)=>{const c=GVNP.tron(e[0]).replace(/——/g,'，');return '<li'+(k<hien?(k===hien-1?' class="moi"':''):' hidden')+' data-k="'+k+'"><div><div class="z" lang="zh">'+GVNP.mk(e[0])+'</div><div class="p">'+esc(e[1]||'')+'</div><div class="v">'+esc(e[2]||'')+'</div></div>'
        +(TTS.can(c)?'<button type="button" class="spk" data-say="'+esc(c)+'" aria-label="Nghe câu này">'+IC('loa')+'</button>':'<span></span>')+'</li>'}).join('')+'</ul>'}
  $('vitri').textContent=s.b.z+' · trang '+(i+1)+' / '+trang.length;nut()}
const conVd=()=>{const s=trang[i];return s.loai==='mau'?(s.r.ex||[]).length-hien:0};
function nut(){const c=conVd(),cuoi=i===trang.length-1;$('bTruoc').disabled=!i&&!hien;
  $('bSau').innerHTML=c>0?IC('them-vuong')+'Hiện ví dụ ('+c+')':cuoi?IC('tick')+'Xong':'Trang sau'+IC('sau')}
function tien(){if(conVd()>0){hien++;const li=[...document.querySelectorAll('.tn-ex li')];li.forEach((x,k)=>x.classList.toggle('moi',k===hien-1));li[hien-1].hidden=false;li[hien-1].scrollIntoView({block:'nearest'});nut();return}
  if(i<trang.length-1){i++;hien=0;ve();len()}else thoat()}
function lui(){const s=trang[i];if(i){i--;const t=trang[i];hien=t.loai==='mau'?(t.r.ex||[]).length:0}else if(s)hien=0;ve();len()}
const len=()=>{$('san').scrollTop=0};
function che(){$('san').classList.toggle('hien-p',o.p);$('san').classList.toggle('hien-v',o.v);$('san').style.setProperty('--z',o.z);$('oP').checked=o.p;$('oV').checked=o.v;
  $('bNho').disabled=o.z<=.8;$('bTo').disabled=o.z>=1.8}
async function chieu(){if(!da.length||dang)return;dang=true;$('bChieu').disabled=true;$('ghi').textContent='Đang mở bài…';
  try{const bai=await Promise.all(da.map(GVNP.tai));trang=dung_(bai);i=0;hien=0;$('caidat').hidden=true;$('san').hidden=false;che();ve();$('san').scrollIntoView();$('ghi').textContent=''}
  catch(e){$('ghi').textContent='Chưa mở được bài. Kiểm tra mạng rồi bấm lại.'}
  dang=false;$('bChieu').disabled=false}
function thoat(){TTS.stop();if(document.fullscreenElement)document.exitFullscreen();$('san').classList.remove('toan');$('san').hidden=true;$('caidat').hidden=false}
$('bChieu').onclick=chieu;$('bSau').onclick=tien;$('bTruoc').onclick=lui;$('bThoat').onclick=thoat;$('bToan').onclick=()=>toan($('san'));
$('trang').onclick=e=>{if(e.target.closest('.spk'))return;const li=e.target.closest('li');if(li)li.classList.toggle('mo')};
$('oP').onchange=e=>{o.p=e.target.checked;luu();che()};$('oV').onchange=e=>{o.v=e.target.checked;luu();che()};
const co=d=>{o.z=Math.round(Math.max(.8,Math.min(1.8,o.z+d))*10)/10;luu();che()};
$('bNho').onclick=()=>co(-.2);$('bTo').onclick=()=>co(.2);
document.addEventListener('keydown',e=>{if($('san').hidden||e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='checkbox')return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='arrowright'||k==='pagedown'){if(k===' '&&e.target.closest('button,input'))return;e.preventDefault();tien()}
  else if(k==='arrowleft'||k==='pageup'){e.preventDefault();lui()}
  else if(k==='p'){o.p=!o.p;luu();che()}else if(k==='v'){o.v=!o.v;luu();che()}});
})();
</script>
