<script>
(function(){
const {$,IC,esc,store}=GV,{seg,tron,toan}=GVT;
const o=Object.assign({mt:'z',py:false,vd:false,doc:true},store.get('gv-the-chop')||{});
const luu=()=>store.set('gv-the-chop',o);
let ds=[],i=0,lat=false,tu=0,hen=0;
const doc=()=>{const x=ds[i];if(x)TTS.say(x.z)};
function ve(){const x=ds[i],T=$('the');
  $('dem').textContent=ds.length?'Thẻ '+(i+1)+' / '+ds.length:'';
  ['bTruoc','bSau','bLat','bDoc','bTron'].forEach(k=>$(k).disabled=!ds.length);
  $('bLat').innerHTML=IC(lat?'sau':'lai')+(lat?'Thẻ tiếp':'Lật thẻ');
  if(!x){T.innerHTML='<span class="goi">Chưa chọn từ nào.</span>';return}
  const n=Math.max(2,[...x.z].length);T.style.setProperty('--n',n);
  const z='<span class="z" lang="zh">'+esc(x.z)+'</span>',p=c=>'<span class="p '+(c||'')+'">'+esc(x.p)+'</span>',v=c=>'<span class="v '+(c||'')+'">'+esc(x.vi||'(chưa có nghĩa)')+'</span>';
  let h='';
  if(lat){h=z+p()+v();if(o.vd&&x.vd)h+='<span class="vd"><b lang="zh">'+esc(x.vd[0])+'</b><span>'+esc(x.vd[1])+'</span><span>'+esc(x.vd[2])+'</span></span>'}
  else if(o.mt==='z')h=z+(o.py?p():'');
  else if(o.mt==='v')h=v('chinh');
  else if(o.mt==='p')h=p('chinh');
  else h='<span class="loa">'+IC('loa-to')+'</span><span class="goi">Nghe rồi đoán chữ</span>';
  T.innerHTML=h}
function den(k){if(!ds.length)return;i=(k+ds.length)%ds.length;lat=false;ve();if(o.mt==='n')doc()}
function lật(){if(!ds.length)return;lat=true;ve();if(o.doc)doc()}
const buoc=()=>lat?den(i+1):lật();
function chay(s){tu=s;clearInterval(hen);if(s)hen=setInterval(buoc,s*1000)}
const tay=f=>{f();if(tu)chay(tu)};   // bấm tay thì tính giờ lại từ đầu
seg($('cdMt'),[['z','Chữ Hán'],['v','Nghĩa'],['p','Pinyin'],['n','Nghe']],o.mt,v=>{o.mt=v;luu();lat=false;ve();if(v==='n')doc()});
seg($('cdTu'),[[0,'Tắt'],[3,'3 giây'],[5,'5 giây'],[8,'8 giây']],0,chay);
[['cdPy','py'],['cdVd','vd'],['cdDoc','doc']].forEach(([id,k])=>{$(id).checked=o[k];$(id).onchange=e=>{o[k]=e.target.checked;luu();ve()}});
$('the').onclick=()=>tay(buoc);$('bLat').onclick=()=>tay(buoc);
$('bTruoc').onclick=()=>tay(()=>den(i-1));$('bSau').onclick=()=>tay(()=>den(i+1));
$('bDoc').onclick=doc;$('bToan').onclick=()=>toan($('san'));
$('bTron').onclick=()=>{ds=tron(ds);tay(()=>den(0));GV.toast('Đã trộn thứ tự thẻ')};
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,summary')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key===' '||e.key==='Enter'){if(e.target.closest('button,a')&&!e.target.closest('#san'))return;e.preventDefault();tay(buoc)}
  else if(e.key==='ArrowRight'){e.preventDefault();tay(()=>den(i+1))}
  else if(e.key==='ArrowLeft'){e.preventDefault();tay(()=>den(i-1))}
  else if(e.key==='r'||e.key==='R')doc();
  else if(e.key==='f'||e.key==='F')toan($('san'))});
GVT.nguon($('nguon'),list=>{ds=list;i=0;lat=false;ve()});
})();
</script>
