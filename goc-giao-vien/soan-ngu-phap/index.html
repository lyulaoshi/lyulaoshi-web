<style>
.s-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.s-ds{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));margin-top:14px}
.s-the{display:grid;gap:6px;align-content:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;min-width:0}
.s-the b{font-size:16px;overflow-wrap:anywhere}
.s-the .z{font-family:var(--kai);font-size:22px;color:var(--teal);overflow-wrap:anywhere}
.s-the small{font-size:13px;color:var(--muted)}
.s-the .row{margin-top:6px}
.s-the a.btn{text-decoration:none}
.s-the .btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:8px 12px}
.s-the .btn.xoa.cho{background:var(--coral);color:#fff}
.s-hai{display:grid;gap:14px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.s-hai{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.s-xem{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}}
.f{display:grid;gap:12px;min-width:0}
.f label{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.f input[type=text],.f textarea{font:600 15px/1.5 var(--vi);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 13px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.f input.zh,.f textarea.zh{font-family:var(--kai),var(--vi);font-size:19px;font-weight:400}
.f textarea{resize:vertical;min-height:96px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--teal)}
.f .goi{font-weight:600;line-height:1.55}
.f .goi code{font-family:var(--kai),var(--vi);font-size:1.15em;background:var(--ground2);border-radius:6px;padding:1px 6px;color:var(--ink)}
.f2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.f .hop{width:100%}
.mau{display:grid;gap:12px;border:2px solid var(--line);border-radius:18px;padding:14px}
.o-mau{display:grid;gap:8px;justify-items:start;font-size:14px}
.o-mau .fx{justify-content:flex-start;gap:6px}
.o-mau .fx>span:not(.plus){cursor:pointer;border-radius:10px}
.o-mau .fx>span:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.o-mau .fx>span.dang{outline:3px solid var(--ink);outline-offset:3px}
.bang-mau{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bang-mau button{width:32px;height:32px;border-radius:50%;border:2px solid var(--card);background:var(--q);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.bang-mau .s1{--q:var(--sky)}.bang-mau .s2{--q:var(--coral)}.bang-mau .s3{--q:var(--butter)}.bang-mau .s4{--q:var(--mint)}.bang-mau .s5{--q:var(--rose)}.bang-mau .s6{--q:var(--teal)}
.bang-mau .tu{width:auto;border-radius:99px;padding:0 12px;background:var(--ground2);color:var(--ink);font:700 13px var(--vi)}
.bang-mau button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.mau-dau{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.xem-tr{display:grid;gap:14px;justify-items:center;text-align:center;background:var(--ground2);border-radius:18px;padding:18px 14px;font-size:16px}
.xem-tr h3{font-size:1.1em}
.xem-tr .tz{font-family:var(--kai);font-size:2em;line-height:1.3;overflow-wrap:anywhere}
.xem-tr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.xem-tr li{background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;display:grid;gap:1px;min-width:0}
.xem-tr li .z{font-family:var(--kai);font-size:1.55em;overflow-wrap:anywhere}
.xem-tr li .p{color:var(--teal);font-weight:700;font-size:.85em}
.xem-tr li .v{color:var(--muted);font-size:.85em}
.xem-tr li s{font-family:var(--kai);font-size:1.4em;color:var(--coral);overflow-wrap:anywhere}
#loi{color:var(--coral);font-weight:700}

<script>
(function(){
const {$,IC,esc,store}=GV,BAI=window.BAI||[];
const KHOA='gv-np-soan',NHAP='gv-np-nhap';
/* ô "Câu sai" chỉ có ích cho công cụ riêng: bản đã khoá chỉ hiện trên máy đã nhớ mật khẩu */
let BENH=false;try{BENH=!!(localStorage.getItem('ll-khoa')||sessionStorage.getItem('ll-khoa'))}catch(e){}
$('fSaiL').hidden=!BENH;
const CHU=['id','z','vi','bai','nguon','sai'],CHU_M=['t','fx','y','vd','mau'];
const chu=v=>typeof v==='string'?v:'';
/* chỉ giữ đúng các trường đã biết (tệp nạp vào có thể bị sửa tay) */
function sach(r){const o={};CHU.forEach(k=>o[k]=chu(r&&r[k]));o.ct=(r&&Array.isArray(r.ct)?r.ct:[]).map(m=>{const x={};CHU_M.forEach(k=>x[k]=chu(m&&m[k]));x.py=m&&Array.isArray(m.py)?m.py.map(chu):[];return x});
  if(!/^s[a-z0-9]+$/.test(o.id))o.id='';return o}
const doc=()=>GVNP.dsSoan().map(sach);
function ghi(l){store.set(KHOA,l);GVNP.napSoan()}
const maMoi=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- pinyin: ghép âm tiết theo từ trong giáo trình; biến điệu 一 / 不 ---------- */
const HAN=/[㐀-鿿]/;
const TU=new Set();BAI.forEach(b=>b.bai.forEach(l=>l.w.forEach(w=>{if(w[0].length>1&&w[0].length<=4)TU.add(w[0])})));
const thanh=p=>/[āēīōūǖ]/.test(p)?1:/[áéíóúǘ]/.test(p)?2:/[ǎěǐǒǔǚ]/.test(p)?3:/[àèìòùǜ]/.test(p)?4:0;
function pinyin(z){const f=window.pinyinPro&&window.pinyinPro.pinyin;if(!f)return'';
  const c=[...String(z).replace(/[\[\]]/g,'')],am=f(c.join(''),{type:'array',nonZh:'spaced'});
  const a=am.map((p,i)=>{const x=c[i],sau=c[i+1],t=sau&&HAN.test(sau)?thanh(am[i+1]||''):0;
    if(x==='不'&&t===4)return'bú';
    if(x==='一'&&sau&&HAN.test(sau)&&!/[第十零〇二三四五六七八九百千万]/.test(c[i-1]||'')&&!/[月号日一二三四五六七八九十零〇]/.test(sau)){if(sau==='个'||t===4)return'yí';if(t)return'yì'}
    return p});
  const doi={'，':',','、':',','。':'.','！':'!','？':'?','：':':','；':';'};let h='';
  for(let i=0;i<c.length;){if(!HAN.test(c[i])){const d=doi[c[i]];h+=d?d+' ':c[i];i++;continue}
    let n=4;while(n>1&&!TU.has(c.slice(i,i+n).join('')))n--;
    const tu=a.slice(i,i+n).join('');h+=(h&&!/[\s“"(（「]$/.test(h)?' ':'')+tu;i+=n}
  return h.replace(/\s+/g,' ').trim().replace(/(^[“"「]?|[.!?]\s+[“"「]?)(\p{L})/gu,(m,x,y)=>x+y.toUpperCase())}
/* pinyin cho từng dòng ví dụ; mất mạng thì giữ pinyin đã lưu của đúng câu đó */
function pyDong(vd,cu,ct){const fx=GVNP.oCongThuc(ct),ch=GVNP.mauO(fx);return GVNP.dong(vd).map(l=>{const z=GVNP.cot(l)[0];return pinyin(GVNP.tron(GVNP.toMau(z,fx,ch)))||(cu&&cu.get(z))||''})}

/* ---------- danh sách ---------- */
const tenBai=k=>{const [s,l]=k.split(':'),b=BAI.find(x=>x.id===s),x=b&&b.bai.find(y=>y.id===l);return x?b.vi+' · Bài '+x.n:''};
function veDs(){const l=doc();$('bLuuTep').disabled=!l.length;
  $('ds').innerHTML=l.length?l.map(r=>{const L=GVNP.chuyen(r),vd=L.rules.reduce((a,m)=>a+m.ex.length,0);
    return '<article class="s-the" data-id="'+esc(r.id)+'"><b>'+esc(r.vi||r.z)+'</b>'+(r.vi&&r.z?'<span class="z" lang="zh">'+esc(r.z)+'</span>':'')
      +'<small>'+[tenBai(r.bai),L.rules.length+' mẫu',vd+' ví dụ',BENH?L.errs.length+' câu sai':''].filter(Boolean).map(esc).join(' · ')+'</small>'
      +'<div class="row"><a class="btn tl" href="../chieu-ngu-phap/?diem='+r.id+'">'+IC('tv')+'Chiếu</a>'+(BENH&&L.errs.length?'<a class="btn gh" href="../bat-benh-cau/?diem='+r.id+'">'+IC('kinh-lup')+'Bắt bệnh</a>':'')
      +'<button class="btn gh sua" type="button">'+IC('but')+'Sửa</button><button class="btn gh xoa" type="button">'+IC('sai')+'Xoá</button></div></article>'}).join('')
    :'<p class="muted">Chưa có điểm nào. Bấm “Soạn điểm mới” để bắt đầu.</p>'}
$('ds').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.closest('.s-the').dataset.id,l=doc();
  if(b.classList.contains('sua')){const r=l.find(x=>x.id===id);if(r)mo(r)}
  else if(!b.classList.contains('cho')){b.classList.add('cho');b.innerHTML=IC('sai')+'Bấm lần nữa để xoá';setTimeout(()=>{if(b.isConnected){b.classList.remove('cho');b.innerHTML=IC('sai')+'Xoá'}},4000)}
  else{ghi(l.filter(x=>x.id!==id));veDs();$('tin').textContent='Đã xoá.'}};

/* ---------- bảng soạn ---------- */
let dang=null,goc='';
const MAU_M={t:'',fx:'',y:'',vd:'',mau:'',py:[]};
const TEN_MAU=['Tự động','Xanh dương','Đỏ san hô','Vàng','Xanh lá','Hồng','Xanh ngọc'];
let oChon=null;   /* ô công thức đang đổi màu: {i: mẫu, k: ô} */
function veOMau(i){const d=$('cacMau').children[i],el=d&&d.querySelector('.o-mau');if(!el)return;
  const m=dang.ct[i],fx=GVNP.oCongThuc(m.fx),ch=GVNP.mauO(fx,m.mau),k=oChon&&oChon.i===i&&oChon.k<fx.length?oChon.k:-1,tc=+String(m.mau||'').split(',')[k]||0;
  el.hidden=!fx.length;el.innerHTML=GVNP.fx(fx,true,ch)+(k<0?'<span class="goi">Màu tự tô. Bấm vào một ô nếu muốn đổi màu.</span>'
    :'<span class="bang-mau" role="group" aria-label="Màu của ô '+esc(fx[k][0])+'">'+TEN_MAU.map((t,n)=>'<button type="button" data-mau="'+n+'" class="'+(n?'s'+n:'tu')+'" aria-pressed="'+(n===tc)+'" aria-label="'+t+'" title="'+t+'">'+(n?'':'Tự động')+'</button>').join('')+'</span>');
  el.querySelectorAll('.fx>span:not(.plus)').forEach((o,n)=>{o.tabIndex=0;o.setAttribute('role','button');o.setAttribute('aria-label','Đổi màu ô '+fx[n][0]);o.dataset.o=n;o.classList.toggle('dang',n===k)})}
function bamOMau(e){const el=e.target.closest('.o-mau');if(!el)return false;const i=[...$('cacMau').children].indexOf(el.closest('.mau')),o=e.target.closest('[data-o]'),b=e.target.closest('[data-mau]');
  layForm();
  if(o){const k=+o.dataset.o,cu=oChon;oChon=cu&&cu.i===i&&cu.k===k?null:{i,k};if(cu&&cu.i!==i)veOMau(cu.i);veOMau(i);if(e.type==='keydown'){const x=el.querySelector('[data-o="'+k+'"]');if(x)x.focus()}}
  else if(b&&oChon){const c=String(dang.ct[i].mau||'').split(',');while(c.length<=oChon.k)c.push('0');c[oChon.k]=b.dataset.mau;dang.ct[i].mau=c.map(x=>x||'0').join(',');oChon=null;veOMau(i);doi()}
  return true}
function theMau(m,i){return '<div class="mau"><div class="mau-dau"><span>Mẫu câu '+(i+1)+'</span><button class="btn gh bo" type="button">Bỏ mẫu này</button></div>'
  +'<label>Công thức<input type="text" data-k="fx" class="zh" value="'+esc(m.fx)+'" placeholder="Chủ ngữ + 把 + O (tân ngữ) + Động từ"><span class="goi">Nối các ô bằng dấu <code>+</code>. Ô chỉ có chữ Hán được tô đậm; chú thích của ô để trong ngoặc.</span></label><div class="o-mau np-san"></div>'
  +'<div class="f2"><label>Tên mẫu (bỏ trống được)<input type="text" data-k="t" value="'+esc(m.t)+'" placeholder="Câu khẳng định"></label><label>Giải thích ngắn<input type="text" data-k="y" value="'+esc(m.y)+'" placeholder="Làm gì đó với một vật đã biết"></label></div>'
  +'<label>Câu ví dụ<textarea data-k="vd" class="zh" placeholder="我把书看完了。 | Tôi đọc xong cuốn sách rồi.">'+esc(m.vd)+'</textarea><span class="goi">Mỗi dòng một câu: <code>câu | nghĩa</code>. Pinyin máy tự thêm; muốn tự ghi thì viết <code>câu | pinyin | nghĩa</code>.<br>Từ khoá tự tô cùng màu công thức. Muốn tô cả câu: ngăn câu bằng <code>/</code> đúng số ô, ví dụ <code>我 / 把 / 书 / 看完了。</code></span></label></div>'}
function veMau(){oChon=null;$('cacMau').innerHTML=dang.ct.map(theMau).join('');dang.ct.forEach((m,i)=>veOMau(i));document.querySelectorAll('#cacMau .bo').forEach(b=>b.hidden=dang.ct.length<2)}
function fillBai(giu){const b=BAI.find(x=>x.id===$('fSach').value),B=$('fBai');$('fBaiL').hidden=!b;B.innerHTML='';
  if(b){b.bai.forEach(l=>B.add(new Option('Bài '+l.n,l.id)));if(b.bai.some(l=>l.id===giu))B.value=giu}GV.hop(B)}
function layForm(){dang.vi=$('fVi').value.trim();dang.z=$('fZ').value.trim();dang.sai=$('fSai').value;
  dang.bai=BAI.some(x=>x.id===$('fSach').value)&&$('fBai').value?$('fSach').value+':'+$('fBai').value:'';
  document.querySelectorAll('#cacMau .mau').forEach((d,i)=>d.querySelectorAll('[data-k]').forEach(x=>dang.ct[i][x.dataset.k]=x.value))}
function coPy(r){r.ct.forEach(m=>{const cu=new Map(GVNP.dong(m.vd0||m.vd).map((l,i)=>[GVNP.cot(l)[0],(m.py||[])[i]]));m.py=pyDong(m.vd,cu,m.fx)});return r}
function xemTruoc(){const L=GVNP.chuyen(coPy(JSON.parse(JSON.stringify(dang))));
  $('xem').innerHTML='<div class="xem-tr"><div class="tz" lang="zh">'+esc(L.title||'…')+'</div><b>'+esc(L.vi)+'</b></div>'
   +L.rules.map(r=>'<div class="xem-tr"><h3>'+esc(r.t)+'</h3>'+GVNP.fx(r.fx,true,r.ch)+(r.mean?'<div class="muted">'+r.mean+'</div>':'')
     +(r.ex.length?'<ul>'+r.ex.map(e=>'<li><span class="z" lang="zh">'+GVNP.mk(e[0])+'</span><span class="p">'+esc(e[1])+'</span><span class="v">'+esc(e[2])+'</span></li>').join('')+'</ul>':'')+'</div>').join('')
   +(BENH&&L.errs.length?'<div class="xem-tr"><h3>Câu sai thường gặp</h3><ul>'+L.errs.map(e=>'<li><s lang="zh">'+esc(e.bad)+'</s><span class="z" lang="zh">'+esc(e.good)+'</span><span class="v">'+e.why+'</span></li>').join('')+'</ul></div>':'')}
let hen=0;
function doi(){layForm();store.set(NHAP,{r:dang,goc});$('loi').textContent='';clearTimeout(hen);hen=setTimeout(xemTruoc,250)}
function mo(r,tuNhap){dang=sach(r);if(!dang.ct.length)dang.ct=[Object.assign({},MAU_M)];
  dang.ct.forEach(m=>m.vd0=m.vd);
  $('fVi').value=dang.vi;$('fZ').value=dang.z;$('fSai').value=dang.sai;
  const [s,l]=dang.bai.split(':');$('fSach').value=BAI.some(x=>x.id===s)?s:'';GV.hop($('fSach'));fillBai(l);veMau();
  layForm();if(!tuNhap)goc=JSON.stringify(dang);
  $('trangDs').hidden=true;$('trangSoan').hidden=false;huyCho();$('loi').textContent='';xemTruoc();scrollTo(0,0)}
function dong(){store.del(NHAP);dang=null;$('trangSoan').hidden=true;$('trangDs').hidden=false;veDs()}
function huyCho(){$('bHuy').dataset.cho='';$('bHuy').textContent='Huỷ'}
$('form').addEventListener('input',e=>{doi();const d=e.target.matches('[data-k=fx]')&&e.target.closest('.mau');if(d)veOMau([...$('cacMau').children].indexOf(d))});
$('cacMau').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-o]')){e.preventDefault();bamOMau(e)}});
$('fSach').addEventListener('change',()=>{fillBai();doi()});$('fBai').addEventListener('change',doi);
$('bThemMau').onclick=()=>{layForm();dang.ct.push(Object.assign({},MAU_M));veMau();doi();const o=document.querySelectorAll('#cacMau [data-k=fx]');o[o.length-1].focus()};
$('cacMau').onclick=e=>{if(bamOMau(e))return;const b=e.target.closest('.bo');if(!b)return;layForm();dang.ct.splice([...$('cacMau').children].indexOf(b.closest('.mau')),1);veMau();doi()};
$('bHuy').onclick=()=>{layForm();if(JSON.stringify(dang)!==goc&&!$('bHuy').dataset.cho){$('bHuy').dataset.cho=1;$('bHuy').textContent='Bấm lần nữa để bỏ phần vừa sửa';return}dong()};
$('form').onsubmit=e=>{e.preventDefault();layForm();
  const L=GVNP.chuyen(dang),thieu=GVNP.dong(dang.sai).filter(x=>{const c=GVNP.cot(x);return!c[0]||!c[1]});
  const loi=!(dang.vi||dang.z)?'Ghi tên điểm ngữ pháp trước đã.':thieu.length?'Dòng câu sai này chưa có câu đúng: “'+thieu[0]+'”. Ngăn câu sai và câu đúng bằng dấu |':!L.rules.length&&!L.errs.length?'Cần ít nhất một công thức hoặc một câu ví dụ'+(BENH?', hoặc một câu sai':'')+'.':'';
  if(loi){$('loi').textContent=loi;return}
  coPy(dang);dang.ct=dang.ct.filter(m=>m.fx.trim()||m.vd.trim()||m.t.trim()||m.y.trim());
  if(!dang.id)dang.id=maMoi();
  const l=doc(),i=l.findIndex(x=>x.id===dang.id),r=sach(dang);i<0?l.push(r):l[i]=r;ghi(l);dong();$('tin').textContent='Đã lưu “'+(r.vi||r.z)+'”.'};
$('bMoi').onclick=()=>mo({});

/* ---------- tệp ---------- */
$('bLuuTep').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({loai:'lyulaoshi-ngu-phap',diem:doc()},null,1)],{type:'application/json'})),a=document.createElement('a');
  a.href=u;a.download='ngu-phap-tu-soan-'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$('tin').textContent='Đã lưu ra tệp trong thư mục Tải về.'};
$('bNapTep').onclick=()=>$('tep').click();
$('tep').onchange=async()=>{const f=$('tep').files[0];$('tep').value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.loai!=='lyulaoshi-ngu-phap'||!Array.isArray(o.diem))throw 0;
    const l=doc();let moi=0,thay=0;o.diem.map(sach).filter(r=>r.vi||r.z).forEach(r=>{if(!r.id)r.id=maMoi();const i=l.findIndex(x=>x.id===r.id);if(i<0){l.push(r);moi++}else{l[i]=r;thay++}});
    ghi(l);veDs();$('tin').textContent='Đã nạp: thêm '+moi+' điểm, thay '+thay+' điểm trùng.'}
  catch(e){$('tin').textContent='Tệp này không phải tệp ngữ pháp lưu từ trang này.'}};

/* ---------- mở trang ---------- */
const S=$('fSach');S.add(new Option('Không gắn',''));BAI.forEach(b=>S.add(new Option(b.vi,b.id)));
veDs();
const q=new URLSearchParams(location.search),nhap=store.get(NHAP);
if(q.has('nguon')){const co=doc().find(r=>r.nguon===q.get('nguon'));
  mo(co||{bai:q.get('bai')||'',nguon:q.get('nguon'),z:q.get('z')||'',vi:q.get('vi')||''});history.replaceState(null,'',location.pathname)}
else if(nhap&&nhap.r){goc=nhap.goc||'';mo(nhap.r,true);$('loi').textContent='Đây là bản đang soạn dở. Bấm Lưu để giữ, hoặc Huỷ để bỏ.'}
})();
</script>
