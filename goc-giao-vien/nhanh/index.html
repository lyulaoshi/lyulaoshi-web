<script>
(function(){
const $=GV.$;
$('chon').innerHTML=GVN.luoi();
function chon(k,cuon){const c=GVN.mo(k,$('vao'))||GVN.mo(GVN.CC[0].k,$('vao'));$('ten').textContent=c.n+' '+c.z;
  [...$('chon').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===c.k));
  if(location.hash!=='#'+c.k)history.replaceState(null,'','#'+c.k);if(cuon)$('san').scrollIntoView()}
$('chon').onclick=e=>{const b=e.target.closest('[data-k]');if(b)chon(b.dataset.k,true)};
addEventListener('hashchange',()=>chon(location.hash.slice(1)));
$('bToan').onclick=()=>{const el=$('san');if(document.fullscreenElement)return document.exitFullscreen();if(el.classList.contains('toan'))return el.classList.remove('toan');
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>el.classList.add('toan'));else el.classList.add('toan')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('san').classList.remove('toan')});
chon(location.hash.slice(1)||GVN.CC[0].k,!!location.hash);
})();
</script>
