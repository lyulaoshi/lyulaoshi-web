<script src="../gv.js?v=11"></script>
<script>
(function(){
const {$,IC,esc,G,dung,nhan,href}=GV;
const d=dung();
GV.paintDung($('dung'),'../');
const TB={chieu:['tv','Máy chiếu'],dt:['dien-thoai','Học viên cần điện thoại']};
$('gcs').innerHTML=G.map(g=>{const theo=g.bo&&d?(nhan(g,d)?'Theo bài đang chọn':'Theo cấp HSK'):(g.bo==='tu'?'Từ của bài':g.bo==='cau'?'Câu của bài':'');
  return '<article class="gc" style="--c:'+g.c+'" data-f="'+g.f.join(' ')+'"><div class="gc-h"><h3>'+esc(g.n)+'</h3><span class="z" lang="zh">'+g.z+'</span></div><p>'+esc(g.p)+'</p>'
  +'<div class="tags"><span>'+IC('dong-ho')+g.ph+'</span><span>'+esc(g.ss)+'</span><span class="'+(g.tb==='dt'?'dt':'')+'">'+IC(TB[g.tb][0])+TB[g.tb][1]+'</span>'+(theo?'<span class="th">'+IC('sach')+theo+'</span>':'')+'</div>'
  +'<div class="ctrl">'+g.ctrl+'</div><a class="go" href="'+href(g,d)+'">'+IC('phat')+'Mở trò</a></article>'}).join('')
  +'<p class="empty" id="gcE" hidden>Chưa có trò nào hợp đủ các điều kiện. Thầy cô bỏ bớt một nút lọc nhé.</p>';
const fb=[...document.querySelectorAll('#fl button')];
function filt(){const on=fb.filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.f);let n=0;
  document.querySelectorAll('.gc').forEach(c=>{const ok=on.every(x=>c.dataset.f.split(' ').includes(x));c.hidden=!ok;if(ok)n++});
  $('flCnt').textContent=n+' / '+G.length+' trò';$('gcE').hidden=n>0}
fb.forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');filt()});filt();
})();
</script>
