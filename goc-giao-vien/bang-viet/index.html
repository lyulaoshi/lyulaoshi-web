@keyframes viet-net{to{stroke-dashoffset:0}}

<script>
(function(){
const {$,IC,esc,store}=GV,{seg,toan,VT}=GVT;
const o=Object.assign({kieu:'tu',luoi:'mi',mo:true,py:true},store.get('gv-bang-viet')||{});
const luu=()=>store.set('gv-bang-viet',o);
const HAN=/[㐀-鿿]/;
const chuCua=z=>[...z].filter(c=>HAN.test(c));
let ds=[],wi=0,ci=0,bang=[],buoc=0,luot=0,lanChay=0,co=0;   /* bang = mỗi ô: {c, viet, net} */

/* thư viện chạy nét tải khi cần */
let napHW=null;
const hanzi=()=>napHW||(napHW=new Promise((ok,loi)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js';s.onload=ok;s.onerror=()=>{napHW=null;s.remove();loi()};document.head.append(s)}));

function luoi(){let d='';const m='stroke="#e7a39c" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"';
  if(o.luoi!=='khong')d+='<path d="M50 0V100M0 50H100" '+m+'/>';
  if(o.luoi==='mi')d+='<path d="M0 0L100 100M100 0L0 100" '+m+'/>';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+d+'<rect x="0" y="0" width="100" height="100" fill="none" stroke="#d6685d" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>'}
/* chữ đang hiện: cả từ, hoặc một chữ đang chọn */
const chuHien=()=>{const cs=ds[wi]?chuCua(ds[wi].z):[];return o.kieu==='tu'?cs:cs.slice(ci,ci+1)};

/* ---------- bảng ---------- */
const KHE=14;
/* cỡ ô và số ô mỗi hàng: ưu tiên cả từ nằm một hàng; ô nhỏ quá thì xuống hàng sao cho ô to nhất */
function xep(n){const full=!!document.fullscreenElement||$('san').classList.contains('toan'),W=$('san').clientWidth-32;
  /* toàn màn hình: chiều cao còn lại sau các hàng khác (khe 12px mỗi hàng, đệm 16px hai đầu) */
  const khac=[...$('san').children].filter(e=>e!==$('vung')&&e.offsetHeight).reduce((t,e)=>t+e.offsetHeight+12,0);
  const H=full?Math.max(220,innerHeight-khac-44):Math.max(260,Math.min(620,innerHeight*.68));
  let tot={s:Math.min((W-(n-1)*KHE)/n,H),cot:n};
  if(tot.s<110)for(let cot=1;cot<n;cot++){const hang=Math.ceil(n/cot),s=Math.min((W-(cot-1)*KHE)/cot,(H-(hang-1)*KHE)/hang);if(s>tot.s)tot={s,cot}}
  return{s:Math.floor(Math.max(90,tot.s)),cot:tot.cot}}
async function dung_(){const l=++luot,cs=chuHien(),x=xep(cs.length||1);lanChay++;co=x.s;buoc=0;bang=cs.map(c=>({c,viet:null,net:null}));
  $('vung').style.maxWidth=(x.cot*co+(x.cot-1)*KHE)+'px';
  $('vung').innerHTML=(cs.length?cs:['']).map((c,i)=>'<div class="o-bang" data-i="'+i+'" style="width:'+co+'px;height:'+co+'px" '+(cs.length>1?'role="button" tabindex="0" aria-label="Viết riêng chữ '+esc(c)+'"':'role="img" aria-label="Chữ '+esc(c)+'"')+'>'
    +luoi()+'<div class="hw"></div><svg class="buoc" viewBox="0 0 1024 1024"></svg></div>').join('');
  bao('');$('bChay').disabled=$('bBuoc').disabled=true;vitri();if(!cs.length)return;
  let nets;try{await hanzi();nets=await Promise.all(cs.map(GVT.net))}catch(e){nets=cs.map(()=>null)}
  if(l!==luot)return;
  bang.forEach((b,i)=>{const hw=$('vung').children[i].querySelector('.hw');b.net=nets[i];
    if(!b.net){hw.insertAdjacentHTML('afterend','<div class="chu-tinh" style="font-size:'+co*.78+'px" lang="zh">'+esc(b.c)+'</div>');return}
    b.viet=HanziWriter.create(hw,b.c,{width:co,height:co,padding:co*.05,showCharacter:false,showOutline:o.mo,strokeColor:'#1b1b1b',outlineColor:'#d9dbe0',radicalColor:null,
      strokeAnimationSpeed:.7,delayBetweenStrokes:380,charDataLoader:(c,xong)=>xong(b.net)});
    /* vừa mở thì hiện sẵn cả chữ, bấm Chạy nét mới viết lại từ đầu */
    b.viet.showCharacter({duration:0})});
  const thieu=bang.filter(b=>!b.net).map(b=>b.c);if(thieu.length)bao('Chưa tải được thứ tự nét của chữ '+thieu.join(', ')+'.','sai');
  $('bChay').disabled=$('bBuoc').disabled=!tongNet();vitri()}
const tongNet=()=>bang.reduce((s,b)=>s+(b.net?b.net.strokes.length:0),0);
function bao(t,k){$('bao').textContent=t;$('bao').className='bv-bao'+(k?' '+k:'')}
function vitri(){const w=ds[wi],n=tongNet();$('vitri').textContent=w?'Từ '+(wi+1)+' / '+ds.length+(n?' · '+bang.map(b=>b.c).join('')+' có '+n+' nét':''):'Chưa có chữ nào'}
/* từng nét: đếm liên tục qua các chữ của từ; nét đang viết chạy chậm theo đường giữa nét (medians) nên đúng hướng bút */
let soNet=0;
function netDang(d,m){const dai=m.reduce((s,p,j)=>j?s+Math.hypot(p[0]-m[j-1][0],p[1]-m[j-1][1]):0,0),giay=Math.min(2.8,Math.max(1.1,dai/330)),id='net'+(++soNet);
  return '<path d="'+d+'" fill="#f6cfcb"/><clipPath id="'+id+'"><path d="'+d+'"/></clipPath>'
    +'<g clip-path="url(#'+id+')"><path class="net-chay" d="M'+m.map(p=>p.join(' ')).join('L')+'" pathLength="1" style="animation-duration:'+giay.toFixed(2)+'s"/></g>'
    +'<circle class="net-dau" cx="'+m[0][0]+'" cy="'+m[0][1]+'" r="30"/>'}
function veBuoc(){let truoc=0;bang.forEach((b,i)=>{const s=$('vung').children[i].querySelector('.buoc');if(!b.net){return}const n=b.net.strokes.length,k=Math.max(0,Math.min(n,buoc-truoc)),dang=buoc>truoc&&buoc<=truoc+n;truoc+=n;
    s.innerHTML=k?'<g transform="'+VT+'">'+b.net.strokes.slice(0,k).map((d,j)=>dang&&j===k-1?netDang(d,b.net.medians[j]):'<path d="'+d+'" fill="#1b1b1b"/>').join('')+'</g>':''})}
const viet1=w=>new Promise(r=>w.animateCharacter({onComplete:r}));
/* chạy nét: lần lượt từng chữ; i = chỉ viết riêng ô đó */
async function chay(i){const ds_=bang.map((b,k)=>[b,k]).filter(([b,k])=>b.viet&&(i==null||k===i));if(!ds_.length)return;const l=++lanChay;
  if(buoc){buoc=0;veBuoc();bang.forEach(b=>b.viet&&b.viet.showCharacter({duration:0}))}bao('');
  ds_.forEach(([b])=>b.viet.hideCharacter({duration:0}));
  if(i!=null)bang.forEach((b,k)=>{if(k!==i&&b.viet)b.viet.showCharacter({duration:0})});
  for(const [b] of ds_){if(l!==lanChay)return;await viet1(b.viet)}}
function tungNet(){const n=tongNet();if(!n)return;lanChay++;if(!buoc)bang.forEach(b=>b.viet&&b.viet.hideCharacter({duration:0}));buoc=buoc>=n?1:buoc+1;veBuoc();bao('Nét '+buoc+' / '+n)}

/* ---------- chọn từ, chọn chữ ---------- */
function veTu(){$('tuDs').innerHTML=ds.map((w,i)=>'<button type="button" data-i="'+i+'" aria-pressed="'+(i===wi)+'" lang="zh">'+esc(w.z)+'</button>').join('')}
function veNghia(){const w=ds[wi];$('nghia').innerHTML=!w?'':(o.py&&w.p?'<span class="p">'+esc(w.p)+'</span>':'')+(o.py&&w.vi?'<span class="v">'+esc(w.vi)+'</span>':'')
  +(TTS.can(w.z)?'<button class="btn gh" type="button" id="bNghe">'+IC('loa')+'Nghe</button>':'');const b=$('bNghe');if(b)b.onclick=()=>TTS.say(w.z,.8)}
function chonTu(i,k){if(!ds.length){wi=ci=0}else{wi=(i+ds.length)%ds.length;const n=chuCua(ds[wi].z).length;ci=k==='cuoi'?n-1:0}
  veTu();veNghia();chonChu(ci)}
function chonChu(k){const w=ds[wi],cs=w?chuCua(w.z):[];ci=k;
  $('chuDs').innerHTML=o.kieu==='chu'&&cs.length>1?cs.map((c,i)=>'<button type="button" data-k="'+i+'" aria-pressed="'+(i===ci)+'" lang="zh">'+esc(c)+'</button>').join(''):'';dung_()}
/* cả từ: ← → đổi từ; từng chữ: đổi chữ, hết chữ thì sang từ */
function sang(d){const w=ds[wi];if(!w)return;const n=chuCua(w.z).length,k=ci+d;if(o.kieu==='chu'&&k>=0&&k<n)chonChu(k);else chonTu(wi+d,d<0&&o.kieu==='chu'?'cuoi':0)}

/* ---------- bảng điều khiển ---------- */
seg($('sKieu'),[['tu','Cả từ'],['chu','Từng chữ']],o.kieu,v=>{o.kieu=v;luu();chonChu(0)});
$('vung').onclick=e=>{const b=e.target.closest('.o-bang[role=button]');if(b)chay(+b.dataset.i)};
$('vung').addEventListener('keydown',e=>{const b=e.target.closest('.o-bang[role=button]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();chay(+b.dataset.i)}});
seg($('sLuoi'),[['mi','米'],['dien','田'],['khong','Trơn']],o.luoi,v=>{o.luoi=v;luu();dung_()});
[['oPy','py',veNghia],['oMo','mo',dung_]].forEach(([id,k,lam])=>{$(id).checked=!!o[k];$(id).onchange=e=>{o[k]=e.target.checked;luu();lam()}});
$('tuDs').onclick=e=>{const b=e.target.closest('button');if(b)chonTu(+b.dataset.i)};
$('chuDs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('chuDs').children].forEach(x=>x.setAttribute('aria-pressed',x===b));chonChu(+b.dataset.k)};
$('fKhac').onsubmit=e=>{e.preventDefault();const z=chuCua($('oKhac').value).join('');if(!z)return;ds=[{z,p:'',vi:''}].concat(ds.filter(w=>w.z!==z));$('oKhac').value='';chonTu(0);$('san').scrollIntoView()};
$('bTruoc').onclick=()=>sang(-1);$('bSau').onclick=()=>sang(1);$('bChay').onclick=()=>chay();$('bBuoc').onclick=tungNet;$('bToan').onclick=()=>toan($('san'));
let hen=0;
const doiCo=()=>{clearTimeout(hen);hen=setTimeout(()=>{if(ds.length&&xep(bang.length||1).s!==co)dung_()},200)};
addEventListener('resize',doiCo);document.addEventListener('fullscreenchange',doiCo);
new MutationObserver(doiCo).observe($('san'),{attributes:true,attributeFilter:['class']});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='checkbox'||e.altKey||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();
  if(k===' '){if(e.target.closest('button,input'))return;e.preventDefault();chay()}else if(k==='n')tungNet();else if(k==='arrowright'){e.preventDefault();sang(1)}else if(k==='arrowleft'){e.preventDefault();sang(-1)}});
GVT.nguon($('nguon'),list=>{ds=list.filter(w=>chuCua(w.z).length);chonTu(0)});
})();
</script>
