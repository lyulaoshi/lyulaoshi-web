<style>
:root{--nen:#FFF8F0;--the:#fff;--chu:#2B2E45;--mo:#6B6F87;--vien:#E8E2DA;--nut:#0F766E;--loi:#B4232F}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--nen:#171826;--the:#222438;--chu:#EEF0FA;--mo:#A9AEC9;--vien:#363955;--nut:#12877D;--loi:#FF8C94}}
:root[data-theme=dark]{--nen:#171826;--the:#222438;--chu:#EEF0FA;--mo:#A9AEC9;--vien:#363955;--nut:#12877D;--loi:#FF8C94}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--nen);color:var(--chu);font-family:"Be Vietnam Pro",system-ui,sans-serif}
main{width:min(400px,100%);background:var(--the);border-radius:24px;padding:28px 22px;box-shadow:0 16px 48px rgba(40,30,20,.14);text-align:center}
main[hidden]{display:none}
img{width:76px;height:76px}
h1{font-size:21px;margin:8px 0 4px}
p{margin:0 0 16px;color:var(--mo);font-size:14.5px;line-height:1.5}
form{display:grid;gap:12px;text-align:left}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--vien);background:var(--nen);color:var(--chu)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--nut);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;font-size:14px}
label input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:38px;height:22px;margin:0;border-radius:99px;background:var(--vien);cursor:pointer}
label input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
label input:checked{background:var(--nut)}label input:checked::after{left:19px}
button{font:inherit;font-weight:800;font-size:16px;padding:12px;border:0;border-radius:999px;background:var(--nut);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.loi{color:var(--loi);font-weight:700;min-height:1.4em;margin:0;font-size:14px;text-align:center}
a{display:inline-block;margin-top:14px;color:var(--mo);font-size:14px}
</style>
<script>try{var t=localStorage.getItem('cb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main id="hop" hidden>
  <img src="/img/logo-hallo-128.png" alt="">
  <h1>Trang riêng</h1>
  <p>Phần này dành cho chủ trang. Nhập mật khẩu để mở.</p>
  <form id="f">
    <input type="text" name="username" autocomplete="username" value="chu-trang" hidden>
    <input type="password" id="mk" autocomplete="current-password" aria-label="Mật khẩu" placeholder="Mật khẩu" required>
    <label><input type="checkbox" id="lau" checked>Nhớ máy này</label>
    <button type="submit" id="mo">Mở</button>
    <p class="loi" id="loi" aria-live="polite"></p>
  </form>
  <a href="/">Về trang chủ</a>
</main>

<script>
(function(){
const $=id=>document.getElementById(id),goi=JSON.parse($('goi').textContent);
/* giải mã xong thì viết lại cả trang, giữ nguyên địa chỉ nên link tương đối và dữ liệu trên máy vẫn dùng được */
function hien(h){const go=()=>setTimeout(()=>{document.open();document.write(h);document.close()},0);
  document.readyState==='complete'?go():addEventListener('load',go,{once:true})}
function hoi(){$('hop').hidden=false;$('mk').focus()}
if(!LLKhoa.duoc){hoi();$('mo').disabled=true;$('loi').textContent='Trình duyệt này không mở khoá được. Hãy dùng Safari hoặc Chrome, địa chỉ https.';return}
LLKhoa.thuNho(goi).then(h=>h?hien(h):hoi(),hoi);
$('f').onsubmit=async e=>{e.preventDefault();const nut=$('mo');nut.disabled=true;$('loi').textContent='';
  try{hien(await LLKhoa.thuMatKhau($('mk').value,goi,$('lau').checked))}
  catch(x){nut.disabled=false;$('loi').textContent='Chưa đúng mật khẩu.';$('mk').select()}};
})();
</script>
